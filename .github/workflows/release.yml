# Release (docs/designs/fleet-delivery-pipeline.md#4-automatic-release, docs/designs/fleet-self-update.md section 1): every
# green main batch publishes one tarball per target, SHA256SUMS signed with the release key (Ed25519, checked by
# fleet-update), latest.json and GitHub build provenance. The version 1.<UTC yymmdd>.<M> comes from the commit
# (deploy/release-version.sh), so the merge queue run already built it; nobody tags.
# Every host's fleet-update installs it by itself. Least privilege: each job gets only what it writes.
name: release
on:
  push:
    branches: [main]
  # A chosen commit on main (the rollback drill, or the first release after a pause); empty means the head of main.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to release (empty for the head of main)
        required: false
# One run at a time; a newer pending run replaces the older pending one, so merges during a run form the next batch.
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      previous: ${{ steps.check.outputs.previous }}
      recent: ${{ steps.check.outputs.recent }}
      digests: ${{ steps.check.outputs.digests }}
      ui: ${{ steps.check.outputs.ui }}
      ui_run: ${{ steps.qualify.outputs.ui_run }}
      spec_run: ${{ steps.qualify.outputs.spec_run }}
      stale: ${{ steps.qualify.outputs.stale }}
      sums: ${{ steps.qualify.outputs.sums }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PAUSE: ${{ github.event_name == 'push' && vars.FLEET_RELEASE_PAUSE || '' }}
      INPUT_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        name: Pause, commit, version
        run: |
          set -o pipefail
          [ -z "$PAUSE" ] || { echo "paused (FLEET_RELEASE_PAUSE)" | tee -a "$GITHUB_STEP_SUMMARY"; echo release=false >> "$GITHUB_OUTPUT"; exit 0; }
          git fetch --force --tags origin main
          sha=$(git rev-parse "${INPUT_SHA:-origin/main}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$latest" ] && git merge-base --is-ancestor "$sha" "$latest^{commit}"; then
            echo "$sha is already in $latest" | tee -a "$GITHUB_STEP_SUMMARY"; echo release=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          ui=false
          if [ -n "$latest" ]; then
            paths=$(git diff --name-only "$latest^{commit}" "$sha")
            if [ -n "$paths" ] && ! printf '%s\n' "$paths" | grep -Ev '^(app/src/|packages/ui/src/|packages/ui/icons.json$)'; then ui=true; fi
          fi
          if [ "$ui" = true ]; then
            for tag in $(git tag -l "ui-${latest#v}-v*"); do
              if [ "$(git rev-parse "$tag^{commit}")" = "$sha" ]; then
                echo "already published UI $sha as $tag"; echo release=false >> "$GITHUB_OUTPUT"; exit 0
              fi
            done
          fi
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          # The commit's own version (deploy/release-version.sh), which its merge queue run already built, when it is newer
          # than every tag; otherwise (a rollback drill of an older commit, an admin push) one more than today's highest.
          version=$(deploy/release-version.sh "$sha")
          newest() { sed 's/^.*v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1; }
          top=$(git tag -l 'v1.*' 'ui-*-v1.*' | newest)
          if [ -n "$top" ] && { [ "$top" = "$version" ] || [ "$(printf '%s\n%s\n' "$top" "$version" | newest)" != "$version" ]; }; then
            day=$(date -u +%y%m%d)
            m=$(git tag -l "v1.$day.*" "ui-*-v1.$day.*" | sed "s/^.*v1\.$day\.//" | sort -n | tail -1)
            version=1.$day.$(( ${m:--1} + 1 ))
          fi
          # The migration check pairs the new coordinator with each of these (fleet-delivery-pipeline.md section 5).
          window=$(deploy/release-recent.sh)
          eval "$window"
          { echo release=true; echo "sha=$sha"; echo "version=$version"; echo "previous=${latest#v}"; echo "recent=$recent"; echo "digests=$digests"; } >> "$GITHUB_OUTPUT"
          echo "release $version from $sha, checked with: ${recent:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact-candidate qualification
        id: qualify
        if: steps.check.outputs.release == 'true'
        env:
          SHA: ${{ steps.check.outputs.sha }}
          UI: ${{ steps.check.outputs.ui }}
          VERSION: ${{ steps.check.outputs.version }}
          RECENT: ${{ steps.check.outputs.recent }}
          DIGESTS: ${{ steps.check.outputs.digests }}
        run: |
          # The merge queue run tested this exact commit; the push run covers an admin bypass.
          id=$(gh run list --workflow ci --commit "$SHA" --event merge_group --json databaseId -q '.[0].databaseId')
          until [ -n "$id" ]; do
            id=$(gh run list --workflow ci --commit "$SHA" --event push --json databaseId -q '.[0].databaseId')
            [ -n "$id" ] || { echo "no ci run for $SHA yet"; sleep 30; }
          done
          # Diagnostic jobs may still be running; only required behavioral conclusions authorize release.
          while :; do
            jobs=$(gh run view "$id" --json jobs)
            pending=false
            for job in go app browser; do
              result=$(jq -r --arg name "$job" '[.jobs[] | select(.name == $name)] | if length == 1 then .[0].conclusion // "" else "missing" end' <<< "$jobs")
              if [ -z "$result" ] || [ "$result" = missing ]; then pending=true
              elif [ "$result" != success ]; then
                echo "::error::$job of ci run $id: $result"; exit 1
              fi
            done
            "$pending" || break
            sleep 30
          done
          gh run download "$id" --name test-qualification --dir "$RUNNER_TEMP/qualification"
          git show "$SHA:scripts/test-selection.ts" > "$RUNNER_TEMP/verify-selection.ts"
          GITHUB_SHA="$SHA" node "$RUNNER_TEMP/verify-selection.ts" --verify "$RUNNER_TEMP/qualification/test-selection.json" "$RUNNER_TEMP/qualification/test-results.json"
          # UI-only: the browser checks of this exact commit ran against a coordinator built from the Go sources of the
          # released backend (the UI-only diff leaves them unchanged), so they are the pair check; publish signs the tree
          # they served. The gate accepts merge_group and push runs only, never a pull_request context.
          if [ "$UI" = true ]; then
            jq -e '.executed | index("browser")' "$RUNNER_TEMP/qualification/test-selection.json" >/dev/null || { echo "::error::browser checks omitted for $SHA"; exit 1; }
            echo "ui_run=$id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The merge queue run's speculative build of this exact commit and version (ci.yml release-build): when it
          # passed, publish signs those bytes; stale: the migration check window moved in a way that check does not cover
          # (deploy/window-covered.sh), so migrate runs it again on the same bytes. Anything else: build here, as before.
          # The required app check waits for release-build, so it has normally concluded; the wait covers API errors,
          # at most 10 minutes and never past 25 minutes of this step, then falls back to building here.
          deadline=$((SECONDS + 600)); [ "$deadline" -le 1500 ] || deadline=1500
          while :; do
            jobs=$(gh run view "$id" --json jobs) || { [ "$SECONDS" -lt "$deadline" ] || { b=timeout; break; }; sleep 10; continue; }
            b=$(jq -r '[.jobs[] | select(.name == "release-build")][0].conclusion // "missing"' <<< "$jobs")
            [ "$b" = missing ] && break
            [ "$SECONDS" -lt "$deadline" ] || { b=timeout; break; }
            [ -z "$b" ] || break
            sleep 10
          done
          [ "$b" != success ] || gh run download "$id" --name release --dir "$RUNNER_TEMP/spec" || true
          spec=$RUNNER_TEMP/spec/speculative.json
          # The digest release-build announced in its own annotation: an artifact another job of that run uploaded under
          # the same name does not match it.
          announced=
          if [ "$b" = success ]; then
            job=$(jq -r '[.jobs[] | select(.name == "release-build")][0].databaseId' <<< "$jobs")
            announced=$(gh api --paginate "repos/$GH_REPO/check-runs/$job/annotations" --jq '.[] | select(.title == "release SHA256SUMS") | .message' | awk 'NR == 1') || announced=
          fi
          if [ -n "$RECENT" ] && [ "$b" = success ] && [ -f "$spec" ] && [ -n "$announced" ] \
            && [ "$(sha256sum < "$RUNNER_TEMP/spec/SHA256SUMS" | cut -d' ' -f1)" = "$announced" ] && jq -e --arg v "$VERSION" --arg c "$SHA" '.version == $v and .commit == $c' "$spec" >/dev/null; then
            stale=false; RECENT=$RECENT DIGESTS=$DIGESTS deploy/window-covered.sh "$spec" || stale=true
            (cd "$RUNNER_TEMP/spec" && sha256sum -c --quiet SHA256SUMS) || { echo "::error::ci run $id: tarballs do not match SHA256SUMS"; exit 1; }
            # migrate and publish download the artifact again and take it only with these exact SHA256SUMS.
            { echo "spec_run=$id"; echo "stale=$stale"; echo "sums=$(sha256sum < "$RUNNER_TEMP/spec/SHA256SUMS" | cut -d' ' -f1)"; } >> "$GITHUB_OUTPUT"
            echo "signing the bytes ci run $id built (window moved: $stale)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no usable speculative build in ci run $id (release-build: $b); building here" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.release == 'true' && needs.gate.outputs.ui != 'true' && needs.gate.outputs.spec_run == ''
    # Signing/publishing and native qualification remain on GitHub-hosted runners.
    runs-on: ${{ github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64","fleet-pds18"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The persistent runner must keep its user's IPC across SSH logins, or the migration check's PostgreSQL loses its
      # shared memory (deploy/infrastructure/pds18-ci/README.md). Checked first, before any build work.
      - name: Runner keeps IPC across logins
        if: runner.environment != 'github-hosted' && needs.gate.outputs.recent != '' && needs.gate.outputs.ui != 'true'
        run: |
          out=$(busctl get-property org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager RemoveIPC 2>"$RUNNER_TEMP/busctl.err") \
            || { echo "::error::cannot read logind RemoveIPC: $(cat "$RUNNER_TEMP/busctl.err")"; exit 1; }
          [ "$out" = "b false" ] || { echo "::error::logind RemoveIPC is on ($out): set RemoveIPC=no on the runner guest"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      # The release scripts of this workflow's commit: a rollback drill builds a commit older than them.
      - uses: actions/checkout@v4
        with:
          path: .release
          sparse-checkout: deploy
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      # The self-hosted runner keeps the pnpm store and the Go caches on its disk (20 MB/s); restoring GitHub's copies
      # over them only costs writes. The hosted fallback has nothing on disk and uses them.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go/go.sum
      - name: Build
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          PREVIOUS: ${{ needs.gate.outputs.previous }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          mkdir out
          deploy/build-release.sh "$SHA" out "$VERSION" "$PREVIOUS" linux/amd64 darwin/arm64
      - name: Selftest linux binaries
        run: |
          .release/deploy/verify-release.sh out new
      # Section 5 of fleet-delivery-pipeline.md. Same job as the build: the runner's disk is capped at 20 MB/s, so no
      # artifact round trip, and the recent coordinators stay extracted under ~/fleet-releases/v between runs.
      - name: New coordinator migrates, each recent one still serves
        if: needs.gate.outputs.recent != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
          RECENT: ${{ needs.gate.outputs.recent }}
          DIGESTS: ${{ needs.gate.outputs.digests }}
        run: .release/deploy/migrate-check.sh new out
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out/
          retention-days: 1
          overwrite: true
          if-no-files-found: error
  # The speculative build's migration check ran against an older window (a release published since): run it again on
  # the same bytes against the current window. Hosted, like the queue run that built them (about 30 s with downloads);
  # the persistent PDS18 runner runs only what it built itself.
  migrate:
    needs: gate
    if: needs.gate.outputs.spec_run != '' && needs.gate.outputs.stale == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.gate.outputs.version }}
      RECENT: ${{ needs.gate.outputs.recent }}
      DIGESTS: ${{ needs.gate.outputs.digests }}
      SUMS: ${{ needs.gate.outputs.sums }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      # The same check script as the fallback build: this workflow's commit.
      - uses: actions/checkout@v4
        with:
          path: .release
          sparse-checkout: deploy
          persist-credentials: false
      - run: |
          gh run download "${{ needs.gate.outputs.spec_run }}" --name release --dir out
          [ -n "$SUMS" ] && [ "$(sha256sum < out/SHA256SUMS | cut -d' ' -f1)" = "$SUMS" ] || { echo "::error::SHA256SUMS changed since the gate"; exit 1; }
          (cd out && sha256sum -c --quiet SHA256SUMS)
          mkdir new && tar -xzf out/fleet-*-linux-amd64.tgz -C new
          .release/deploy/migrate-check.sh new out
  # GitHub refuses the workflow token (it cannot hold the workflows permission) a new tag on a commit whose
  # .github/workflows differ from the head of main: HTTP 403 "Resource not accessible by integration" (run 43237511138,
  # 2026-11-12: main had moved on to a merge that changed workflows). That head contains this commit and its push started
  # the next release run, which publishes a release containing it; this run then publishes nothing and ends green.
  # Push runs only: a dispatched older commit (rollback drill) is meant to be released as it is.
  supersede:
    needs: [gate, build, migrate]
    if: always() && github.event_name == 'push' && needs.gate.result == 'success' && needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.moved.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          persist-credentials: false
      - id: moved
        run: |
          # An API error here publishes as before; publish catches the 403 itself.
          moved=$(deploy/workflows-moved.sh "$SHA") || moved=0
          if [ "$moved" != 0 ]; then
            echo "superseded: main changed workflows since $SHA; the next release run publishes it" | tee -a "$GITHUB_STEP_SUMMARY"
            echo skip=true >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: [gate, build, migrate, supersede]
    if: >-
      always() && needs.gate.result == 'success' && needs.supersede.outputs.skip != 'true' && needs.gate.outputs.release == 'true' && (needs.gate.outputs.ui == 'true'
      || (needs.gate.outputs.spec_run != '' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped' && needs.gate.outputs.stale != 'true'))
      || needs.build.result == 'success')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.gate.outputs.version }}
      SHA: ${{ needs.gate.outputs.sha }}
      RECENT: ${{ needs.gate.outputs.recent }}
      UI: ${{ needs.gate.outputs.ui }}
      BACKEND: ${{ needs.gate.outputs.previous }}
      UI_RUN: ${{ needs.gate.outputs.ui_run }}
      SPEC_RUN: ${{ needs.gate.outputs.spec_run }}
      SUMS: ${{ needs.gate.outputs.sums }}
    steps:
      # deploy/ of this workflow's commit: the supersede check.
      - uses: actions/checkout@v4
        with:
          path: .release
          sparse-checkout: deploy
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: env.UI != 'true' && env.SPEC_RUN == ''
        with:
          name: release
      # The bytes the merge queue run built, selftested and migration-checked (gate); signing covers exactly these.
      - name: Speculative build
        if: env.UI != 'true' && env.SPEC_RUN != ''
        run: |
          gh run download "$SPEC_RUN" --name release --dir .
          rm speculative.json
          [ -n "$SUMS" ] && [ "$(sha256sum < SHA256SUMS | cut -d' ' -f1)" = "$SUMS" ] || { echo "::error::SHA256SUMS changed since the gate"; exit 1; }
          sha256sum -c SHA256SUMS
      # The tree the qualifying ci run browser-checked (gate); release.json binds it to version, backend and source.
      - name: UI archive
        if: env.UI == 'true'
        run: |
          gh run download "$UI_RUN" --name fleet-ui --dir "$RUNNER_TEMP/ui"
          test -f "$RUNNER_TEMP/ui/index.html"
          jq -nc --arg v "$VERSION" --arg b "$BACKEND" --arg c "$SHA" '{kind:"ui",version:$v,backendVersion:$b,commit:$c}' > "$RUNNER_TEMP/ui/release.json"
          file="fleet-ui-$VERSION.tgz"
          tar --owner=0 --group=0 -czf "$file" -C "$RUNNER_TEMP/ui" .
          sha256sum "$file" > SHA256SUMS
      # A re-run after a later release published must not reuse its version or move latest backwards.
      - name: Version still free and newest
        run: |
          tag="v$VERSION"
          [ "$UI" != true ] || tag="ui-$BACKEND-v$VERSION"
          git ls-remote --tags "https://github.com/$GH_REPO.git" > "$RUNNER_TEMP/release-tags"
          ! awk -v version="$VERSION" '{ tag=$2; sub(/^refs\/tags\//,"",tag); sub(/^.*v/,"",tag); if (tag==version) found=1 } END { exit !found }' "$RUNNER_TEMP/release-tags" || { echo "::error::version already allocated"; exit 1; }
          ! gh release view "$tag" >/dev/null 2>&1 || { echo "::error::v$VERSION already exists"; exit 1; }
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "${latest#v}" "$VERSION" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)" = "$VERSION" ] \
            || { echo "::error::$VERSION is not newer than $latest; start a new run"; exit 1; }
      - name: Sign SHA256SUMS, write latest.json
        env:
          FLEET_RELEASE_KEY: ${{ secrets.FLEET_RELEASE_KEY }}
        run: |
          umask 077
          key=$RUNNER_TEMP/release-key.pem
          printf '%s\n' "$FLEET_RELEASE_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$key"
          # checkedWith: the releases the migration check paired with this one; fleet-update pds18 asks when it runs another.
          checked=$(jq -nc '$ARGS.positional' --args $RECENT)
          printf '{"version":"%s","files":{"linux-amd64":"fleet-%s-linux-amd64.tgz","darwin-arm64":"fleet-%s-darwin-arm64.tgz"},"checkedWith":%s}\n' \
            "$VERSION" "$VERSION" "$VERSION" "$checked" > latest.json
      - id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: fleet-*.tgz
      - run: |
          cp "${{ steps.attest.outputs.bundle-path }}" provenance.sigstore.jsonl
          if [ "$UI" = true ]; then
            set -- "ui-$BACKEND-v$VERSION" --latest=false --title "Fleet UI $VERSION" --notes "UI $VERSION for backend $BACKEND; source $SHA" \
              fleet-ui-*.tgz SHA256SUMS SHA256SUMS.sig provenance.sigstore.jsonl
          else
            set -- "v$VERSION" --latest --title "v$VERSION" --notes "Fleet $VERSION" \
              fleet-*.tgz SHA256SUMS SHA256SUMS.sig latest.json provenance.sigstore.jsonl
          fi
          # Only that 403, on a push run, and only when main did move on with workflow changes after the check above:
          # superseded the same way. Any other failure fails the job.
          gh release create "$1" --target "$SHA" "${@:2}" 2> "$RUNNER_TEMP/create.err" && exit 0
          code=$?; cat "$RUNNER_TEMP/create.err" >&2
          grep -q 'HTTP 403: Resource not accessible by integration' "$RUNNER_TEMP/create.err" && [ "$GITHUB_EVENT_NAME" = push ] \
            && n=$(.release/deploy/workflows-moved.sh "$SHA") && [ -n "$n" ] && [ "$n" != 0 ] || exit "$code"
          # gh uploads the assets to a draft and publishes it last; the refused publish leaves that draft, without a tag.
          gh release delete "$1" --yes
          echo "superseded: main changed workflows since $SHA; the next release run publishes it" | tee -a "$GITHUB_STEP_SUMMARY"
