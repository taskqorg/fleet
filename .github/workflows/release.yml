# Release (docs/designs/fleet-delivery-pipeline.md#4-automatic-release, docs/designs/fleet-self-update.md section 1): every
# green main batch publishes one tarball per target, SHA256SUMS signed with the release key (Ed25519, checked by
# fleet-update), latest.json and GitHub build provenance. The version 1.<UTC yymmdd>.<M> is computed here; nobody tags.
# Every host's fleet-update installs it by itself. Least privilege: each job gets only what it writes.
name: release
on:
  push:
    branches: [main]
  # A chosen commit on main (the rollback drill, or the first release after a pause); empty means the head of main.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to release (empty for the head of main)
        required: false
# One run at a time; a newer pending run replaces the older pending one, so merges during a run form the next batch.
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      previous: ${{ steps.check.outputs.previous }}
      recent: ${{ steps.check.outputs.recent }}
      digests: ${{ steps.check.outputs.digests }}
      ui: ${{ steps.check.outputs.ui }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PAUSE: ${{ github.event_name == 'push' && vars.FLEET_RELEASE_PAUSE || '' }}
      INPUT_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        name: Pause, commit, version
        run: |
          set -o pipefail
          [ -z "$PAUSE" ] || { echo "paused (FLEET_RELEASE_PAUSE)" | tee -a "$GITHUB_STEP_SUMMARY"; echo release=false >> "$GITHUB_OUTPUT"; exit 0; }
          git fetch --force --tags origin main
          sha=$(git rev-parse "${INPUT_SHA:-origin/main}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$latest" ] && git merge-base --is-ancestor "$sha" "$latest^{commit}"; then
            echo "$sha is already in $latest" | tee -a "$GITHUB_STEP_SUMMARY"; echo release=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          ui=false
          if [ -n "$latest" ]; then
            paths=$(git diff --name-only "$latest^{commit}" "$sha")
            if [ -n "$paths" ] && ! printf '%s\n' "$paths" | grep -Ev '^(app/src/|packages/ui/src/|packages/ui/icons.json$)'; then ui=true; fi
          fi
          if [ "$ui" = true ]; then
            for tag in $(git tag -l "ui-${latest#v}-v*"); do
              if [ "$(git rev-parse "$tag^{commit}")" = "$sha" ]; then
                echo "already published UI $sha as $tag"; echo release=false >> "$GITHUB_OUTPUT"; exit 0
              fi
            done
          fi
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          day=$(date -u +%y%m%d)
          m=$(git tag -l "v1.$day.*" "ui-*-v1.$day.*" | sed "s/^.*v1\.$day\.//" | sort -n | tail -1)
          version=1.$day.$(( ${m:--1} + 1 ))
          # The migration check in build pairs the new coordinator with each of these (fleet-delivery-pipeline.md section 5).
          # digests: "<version>=sha256:<hex>" of each one's linux tarball, so build verifies and caches them without more lookups.
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name as $t | "\($t) \([.assets[] | select(.name == "fleet-\($t | ltrimstr("v"))-linux-amd64.tgz") | .digest // empty] | first // "")"' | awk '$1 ~ /^v1\.[0-9][0-9][0-9][0-9][0-9][0-9]\.[0-9]+$/ && n++ < 5 { print substr($1,2), $2 }')
          recent=$(awk 'NF { printf "%s%s", sep, $1; sep=" " } END { print "" }' <<< "$releases")
          digests=$(awk 'NF { printf "%s%s=%s", sep, $1, $2; sep=" " } END { print "" }' <<< "$releases")
          { echo release=true; echo "sha=$sha"; echo "version=$version"; echo "previous=${latest#v}"; echo "recent=$recent"; echo "digests=$digests"; } >> "$GITHUB_OUTPUT"
          echo "release $version from $sha, checked with: ${recent:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact-candidate qualification
        if: steps.check.outputs.release == 'true'
        env:
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          # The merge queue run tested this exact commit; the push run covers an admin bypass.
          id=$(gh run list --workflow ci --commit "$SHA" --event merge_group --json databaseId -q '.[0].databaseId')
          until [ -n "$id" ]; do
            id=$(gh run list --workflow ci --commit "$SHA" --event push --json databaseId -q '.[0].databaseId')
            [ -n "$id" ] || { echo "no ci run for $SHA yet"; sleep 30; }
          done
          # Diagnostic jobs may still be running; only required behavioral conclusions authorize release.
          while :; do
            jobs=$(gh run view "$id" --json jobs)
            pending=false
            for job in go app browser; do
              result=$(jq -r --arg name "$job" '[.jobs[] | select(.name == $name)] | if length == 1 then .[0].conclusion // "" else "missing" end' <<< "$jobs")
              if [ -z "$result" ] || [ "$result" = missing ]; then pending=true
              elif [ "$result" != success ]; then
                echo "::error::$job of ci run $id: $result"; exit 1
              fi
            done
            "$pending" || break
            sleep 30
          done
          gh run download "$id" --name test-qualification --dir "$RUNNER_TEMP/qualification"
          git show "$SHA:scripts/test-selection.ts" > "$RUNNER_TEMP/verify-selection.ts"
          GITHUB_SHA="$SHA" node "$RUNNER_TEMP/verify-selection.ts" --verify "$RUNNER_TEMP/qualification/test-selection.json" "$RUNNER_TEMP/qualification/test-results.json"
  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    # Signing/publishing and native qualification remain on GitHub-hosted runners.
    runs-on: ${{ github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64","fleet-pds18"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      # The self-hosted runner keeps the pnpm store and the Go caches on its disk (20 MB/s); restoring GitHub's copies
      # over them only costs writes. The hosted fallback has nothing on disk and uses them.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go/go.sum
      - name: Build
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          PREVIOUS: ${{ needs.gate.outputs.previous }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          mkdir out
          if [ "${{ needs.gate.outputs.ui }}" = true ]; then
            deploy/build-ui-release.sh "$SHA" out "$VERSION" "$PREVIOUS"
          else
            deploy/build-release.sh "$SHA" out "$VERSION" "$PREVIOUS" linux/amd64 darwin/arm64
          fi
      - name: Selftest linux binaries
        if: needs.gate.outputs.ui != 'true'
        run: |
          mkdir new && tar -xzf out/fleet-*-linux-amd64.tgz -C new
          for b in fleet-coordinator fleet-gateway fleet-executor fleet-update; do (cd /tmp && env -i "$GITHUB_WORKSPACE/new/$b" selftest); done
      # Upgrade, then expand and contract: the new coordinator migrates a database the latest release built, and each of
      # the last 5 releases' coordinators must still serve on the database the new one migrated, so a rollback on PDS18
      # from up to 5 releases behind returns to a checked pair (fleet-delivery-pipeline.md section 5). Same job as the
      # build: the runner's disk is capped at 20 MB/s, so no artifact round trip, the recent coordinators stay extracted
      # under ~/fleet-releases/v between runs (one download per new release) and the throwaway PostgreSQL skips fsync.
      - name: New coordinator migrates, each recent one still serves
        if: needs.gate.outputs.recent != '' && needs.gate.outputs.ui != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
          RECENT: ${{ needs.gate.outputs.recent }}
          DIGESTS: ${{ needs.gate.outputs.digests }}
        run: |
          set -o pipefail
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | tail -1):$PATH" pg=$RUNNER_TEMP/pg
          # The runner is persistent: a failed step must not leave a coordinator on the port or a PostgreSQL behind, and a
          # cancelled one (killed before the trap) is cleared here.
          stale() { "$@" -u "$(id -u)" -f '(^|/)fleet-coordinator$|postgres .*-p 54329'; }
          stale pkill || true
          i=0; while stale pgrep >/dev/null && [ $i -lt 10 ]; do i=$((i+1)); sleep 1; done
          stale pkill -KILL || true
          stop() { kill "$1" || return 0; for _ in 1 2 3 4 5; do kill -0 "$1" || return 0; sleep 1; done; kill -KILL "$1"; wait "$1"; }
          pid=; trap '{ [ -z "$pid" ] || stop $pid; pg_ctl -D "$pg" -m immediate -w stop; } >/dev/null 2>&1 || true' EXIT
          initdb -D "$pg" -U postgres -A trust -E UTF8 --no-instructions --no-sync >/dev/null
          pg_ctl -D "$pg" -l "$pg/log" -w -o "-k $pg -p 54329 -c listen_addresses= -c fsync=off -c synchronous_commit=off -c full_page_writes=off" start
          psql -h "$pg" -p 54329 -U postgres -v ON_ERROR_STOP=1 -q -d postgres -f deploy/infrastructure/fleet-postgres.sql
          # Each entry holds the release's fleet-coordinator, config/ and release.json and the sha256 digest of the asset it
          # came from; a replaced asset (new digest) is fetched again, and the download is checked against that digest.
          # An asset GitHub reports no digest for is fetched every run, unchecked, as before the cache.
          # One extra level: a coordinator's repoRoot() probes two directories above its binary for config/, never $HOME.
          cache=${HOME:?}/fleet-releases/v; mkdir -p "$cache"
          for d in "$cache"/*/; do d=${d%/}; [ -d "$d" ] || continue; case " $RECENT " in *" ${d##*/} "*) rm -rf "${d:?}/var";; *) rm -rf "$d";; esac; done
          members="./fleet-coordinator ./config ./release.json"
          for v in $RECENT; do
            file=fleet-$v-linux-amd64.tgz
            digest=$(printf '%s\n' $DIGESTS | awk -F= -v v="$v" '$1 == v { print $2 }')
            [ -n "$digest" ] && [ -x "$cache/$v/fleet-coordinator" ] && [ "$(cat "$cache/$v/.digest" 2>/dev/null)" = "$digest $members" ] && continue
            rm -rf "$cache/$v.tmp"; mkdir "$cache/$v.tmp"
            gh release download "v$v" -p "$file" -D "$RUNNER_TEMP" --clobber || { echo "::error::v$v: download failed"; exit 1; }
            [ -z "$digest" ] || echo "${digest#sha256:}  $RUNNER_TEMP/$file" | sha256sum -c --quiet || { echo "::error::v$v: $file does not match its digest"; exit 1; }
            tar -xzf "$RUNNER_TEMP/$file" -C "$cache/$v.tmp" $members || { echo "::error::v$v: extraction failed"; exit 1; }
            rm -f "$RUNNER_TEMP/$file"; echo "$digest $members" > "$cache/$v.tmp/.digest"
            rm -rf "${cache:?}/$v"; mv "$cache/$v.tmp" "$cache/$v"
          done
          url() { echo "postgresql://$1@/fleet?host=$pg&port=54329"; }
          export PORT=9470 FLEET_DATABASE_URL=$(url fleet_app) FLEET_MIGRATION_DATABASE_URL=$(url fleet) \
            FLEET_PEOPLE_FILE=$PWD/tests/trial/people.json FLEET_BROWSER_SECRET=migrate-check FLEET_HOST_ID=pds18
          # exec: kill stops the coordinator itself; a leftover one on the port shows as the fresh process exiting.
          # The latest release builds the database first, as PDS18's is: the new coordinator then applies only its new
          # migrations on top (a fresh database alone hides a migration that depends on an edited released one).
          for v in "${RECENT%% *}" "$VERSION" $RECENT; do
            dir=$cache/$v; [ "$v" = "$VERSION" ] && dir=$PWD/new
            (cd "$dir" && FLEET_PROJECT_CONFIG_DIRECTORY=$dir/config FLEET_PROFILES_DIRECTORY=$dir/config/agents FLEET_LAB_DIRECTORY=$dir/config/lab exec ./fleet-coordinator) & pid=$!
            t=$SECONDS; until kill -0 $pid 2>/dev/null && curl -fsS -m 3 -o "$RUNNER_TEMP/health" http://127.0.0.1:9470/api/health && grep -q "\"version\":\"$v\"" "$RUNNER_TEMP/health"; do
              kill -0 $pid 2>/dev/null || { echo "::error::$dir coordinator exited"; exit 1; }
              [ $((SECONDS - t)) -lt 120 ] || { echo "::error::$dir coordinator not healthy after 120 s"; exit 1; }; sleep 1; done
            echo; kill $pid || { echo "::error::$dir coordinator exited after health"; exit 1; }; wait $pid || true; pid=
          done
          # Seed the cache with this release (GitHub's asset digest is the sha256 of the uploaded bytes), so the next run
          # downloads nothing; an entry for a version that never publishes is pruned by the sweep above.
          file=fleet-$VERSION-linux-amd64.tgz
          rm -rf "$cache/$VERSION.tmp"; mkdir "$cache/$VERSION.tmp"
          tar -xzf "out/$file" -C "$cache/$VERSION.tmp" $members
          echo "sha256:$(awk -v f="$file" '$2 == f { print $1 }' out/SHA256SUMS) $members" > "$cache/$VERSION.tmp/.digest"
          rm -rf "${cache:?}/$VERSION"; mv "$cache/$VERSION.tmp" "$cache/$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out/
          if-no-files-found: error
  selftest-macos:
    needs: [gate, build]
    if: needs.gate.outputs.ui != 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - run: |
          mkdir t && tar -xzf fleet-*-darwin-arm64.tgz -C t
          for b in fleet-coordinator fleet-gateway fleet-executor fleet-update; do (cd /tmp && env -i "$GITHUB_WORKSPACE/t/$b" selftest); done
  ui-check:
    needs: [gate, build]
    if: needs.gate.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.gate.outputs.version }}
      PREVIOUS: ${{ needs.gate.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out
      - name: Exact UI archive with released backend
        run: |
          mkdir -p dist/app "$RUNNER_TEMP/previous"
          tar -xzf "out/fleet-ui-$VERSION.tgz" -C dist/app
          gh release download "v$PREVIOUS" -p "fleet-$PREVIOUS-linux-amd64.tgz" -D "$RUNNER_TEMP/previous"
          tar -xzf "$RUNNER_TEMP/previous/fleet-$PREVIOUS-linux-amd64.tgz" -C "$RUNNER_TEMP/previous"
          export CI=true FLEET_TRIAL_SERVER="$RUNNER_TEMP/previous/fleet-coordinator" FLEET_APP_DIR="$PWD/dist/app" FLEET_TRIAL_PGDATA="$RUNNER_TEMP/ui-pg"
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | tail -1):$PATH"
          node tests/ui/filter.check.ts --assert
          node tests/ui/conversations.check.ts
          node tests/ui/lab-create.check.ts
  publish:
    needs: [gate, build, selftest-macos, ui-check]
    if: always() && needs.build.result == 'success' && (needs.gate.outputs.ui != 'true' || needs.ui-check.result == 'success') && needs.gate.outputs.release == 'true' && (needs.selftest-macos.result == 'success' || (needs.gate.outputs.ui == 'true' && needs.selftest-macos.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.gate.outputs.version }}
      SHA: ${{ needs.gate.outputs.sha }}
      RECENT: ${{ needs.gate.outputs.recent }}
      UI: ${{ needs.gate.outputs.ui }}
      BACKEND: ${{ needs.gate.outputs.previous }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      # A re-run after a later release published must not reuse its version or move latest backwards.
      - name: Version still free and newest
        run: |
          tag="v$VERSION"
          [ "$UI" != true ] || tag="ui-$BACKEND-v$VERSION"
          git ls-remote --tags "https://github.com/$GH_REPO.git" > "$RUNNER_TEMP/release-tags"
          ! awk -v version="$VERSION" '{ tag=$2; sub(/^refs\/tags\//,"",tag); sub(/^.*v/,"",tag); if (tag==version) found=1 } END { exit !found }' "$RUNNER_TEMP/release-tags" || { echo "::error::version already allocated"; exit 1; }
          ! gh release view "$tag" >/dev/null 2>&1 || { echo "::error::v$VERSION already exists"; exit 1; }
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "${latest#v}" "$VERSION" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)" = "$VERSION" ] \
            || { echo "::error::$VERSION is not newer than $latest; start a new run"; exit 1; }
      - name: Sign SHA256SUMS, write latest.json
        env:
          FLEET_RELEASE_KEY: ${{ secrets.FLEET_RELEASE_KEY }}
        run: |
          umask 077
          key=$RUNNER_TEMP/release-key.pem
          printf '%s\n' "$FLEET_RELEASE_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$key"
          # checkedWith: the releases the migration check paired with this one; fleet-update pds18 asks when it runs another.
          checked=$(jq -nc '$ARGS.positional' --args $RECENT)
          printf '{"version":"%s","files":{"linux-amd64":"fleet-%s-linux-amd64.tgz","darwin-arm64":"fleet-%s-darwin-arm64.tgz"},"checkedWith":%s}\n' \
            "$VERSION" "$VERSION" "$VERSION" "$checked" > latest.json
      - id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: fleet-*.tgz
      - run: |
          cp "${{ steps.attest.outputs.bundle-path }}" provenance.sigstore.jsonl
          if [ "$UI" = true ]; then
            gh release create "ui-$BACKEND-v$VERSION" --target "$SHA" --latest=false --title "Fleet UI $VERSION" --notes "UI $VERSION for backend $BACKEND; source $SHA" \
              fleet-ui-*.tgz SHA256SUMS SHA256SUMS.sig provenance.sigstore.jsonl
          else
            gh release create "v$VERSION" --target "$SHA" --latest --title "v$VERSION" --notes "Fleet $VERSION" \
              fleet-*.tgz SHA256SUMS SHA256SUMS.sig latest.json provenance.sigstore.jsonl
          fi
