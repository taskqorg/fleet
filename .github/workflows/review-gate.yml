# The required check code-review in the merge queue (docs/designs/fleet-delivery-pipeline.md#8-workers-merge-and-watch-their-own-pull-requests).
# On a pull request the worker posts the commit status code-review after /code-review; that status lets it enter the queue.
# The group commit in the queue carries no status, so this job reports the check there. It runs on no pull request:
# a skipped code-review check on a pull request would satisfy the ruleset without a review. workflow_dispatch is for
# pins-merge.yml, whose token's enqueue starts no merge_group run; a dispatch passes only on a merge queue branch.
name: review-gate
on:
  merge_group:
  workflow_dispatch:
permissions: {}
jobs:
  code-review:
    runs-on: ubuntu-24.04
    steps:
      - env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/gh-readonly-queue/*) echo "Each pull request in this group entered the queue with the code-review status on its head." ;;
            *) echo "review-gate reports code-review only on a merge queue branch, not on $REF"; exit 1 ;;
          esac
