# Step 5 of the host update procedure (docs/designs/fleet-host-updates.md): merge a qualified component pin proposal.
# The coordinator posts code-review on an automation/<kind>-pins head after its diff review and host trials passed
# (github-pins, a token that may write statuses only). That status raises this event; this run checks the proposal
# and its three statuses, turns on auto-merge with the workflow token and, because that token's enqueue starts no
# merge_group run, dispatches ci and review-gate on the queue's group branch when none started there.
name: Managed component pins (merge)
on:
  status:
  # A head whose statuses were all posted before this workflow ran (or whose run timed out) is merged by hand dispatch.
  workflow_dispatch:
    inputs:
      sha:
        description: Head commit of the qualified proposal
        required: true
permissions: {}
concurrency:
  group: pins-merge-${{ github.event.sha || inputs.sha }}
  cancel-in-progress: false
jobs:
  merge:
    if: github.event_name == 'workflow_dispatch' || (github.event.context == 'code-review' && github.event.state == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha || inputs.sha }}
          # The user of the github-pins key (System > Access), whose statuses are the coordinator's.
          PINS_STATUS_LOGIN: alexkirs
        run: |
          set -euo pipefail
          # Everything is read through the API and checked here; the event is not trusted and no pull request code is
          # checked out or run with this token.
          # 1. An open proposal of this repository (not a fork): head automation/<kind>-pins at this commit, base main.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[] | select(.state == "open" and (.head.ref | test("^automation/(cli|tool)-pins$")) and .head.repo.full_name == env.GITHUB_REPOSITORY and .base.repo.full_name == env.GITHUB_REPOSITORY and .base.ref == "main" and .head.sha == env.SHA)][0].number // empty')
          [ -n "$pr" ] || { echo "not a pin proposal head"; exit 0; }
          kind=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.ref | capture("^automation/(?<k>[a-z]+)-pins$").k')
          file=config/$([ "$kind" = cli ] && echo harness || echo tool)-pins.json
          # 2. The diff touches only that kind's pin file.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/files" --jq '.[] | "\(.status) \(.filename)"')
          [ "$files" = "modified $file" ] || { echo "the proposal changes more than $file: $files"; exit 1; }
          # 3. On the current head: qualify-offline by this workflow's bot, qualify-hosts and code-review by the github-pins
          #    key's user (the coordinator), each success.
          statuses=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses?per_page=100" --jq '.[]' | jq -s .)
          check() {
            got=$(jq -r --arg c "$1" 'map(select(.context == $c)) | sort_by(.created_at) | last | "\(.state) \(.creator.login)"' <<< "$statuses")
            [ "$got" = "success $2" ] || { echo "$1 is '$got', expected 'success $2'"; exit 1; }
          }
          check qualify-offline 'github-actions[bot]'
          check qualify-hosts "$PINS_STATUS_LOGIN"
          check code-review "$PINS_STATUS_LOGIN"
          [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)" = "$SHA" ] || { echo "head moved"; exit 0; }
          gh pr merge "$pr" -R "$GITHUB_REPOSITORY" --auto
          declare -A dispatched=()
          for _ in $(seq 170); do
            state=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json state --jq .state)
            [ "$state" = MERGED ] && exit 0
            [ "$state" = CLOSED ] && { echo "pull request closed"; exit 1; }
            while read -r qsha ref; do
              [ -n "$ref" ] && [ -z "${dispatched[$qsha]:-}" ] || continue
              sleep 60
              if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$qsha" --jq '.total_count')" = 0 ]; then
                gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "${ref#refs/heads/}"
                gh workflow run review-gate.yml -R "$GITHUB_REPOSITORY" --ref "${ref#refs/heads/}"
              fi
              dispatched[$qsha]=1
            done < <(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "refs/heads/gh-readonly-queue/main/pr-$pr-*")
            sleep 30
          done
          echo "not merged within the wait"
          exit 1
