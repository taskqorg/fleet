# Build and test gate the job; the design report never does (D6, D14).
# ubuntu-24.04 is pinned because Playwright has no Chromium build for ubuntu-latest (26.04) yet.
# Least privilege: no token scopes by default; the build job reads only, and only the comment job,
# which checks out no PR code, may write a PR comment.
name: ci
on:
  pull_request:
permissions: {}
jobs:
  build-test-design:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The executor: its unit tests, and the binary the coordinator's end-to-end artifact test runs.
      - run: cargo build -p fleet-executor && cargo test -p fleet-executor
      - run: pnpm test
      - name: Install Chromium for the design checks
        if: always()
        run: pnpm exec playwright install --with-deps chromium
      - name: Design report (warnings only)
        if: always()
        continue-on-error: true
        run: |
          pnpm run book
          pnpm run check:design
          { echo '### Design report (warnings only)'; echo '```'; cat design-report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload design report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-report
          path: |
            design-report/
            docs/design-system/book/index.html
            docs/design-system/pages/mockups.html
          if-no-files-found: warn
  # The filter-path check (docs/designs/fleet-view-urls-and-list-path.md §4): its own job, so it does not slow build-test-design.
  filter-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check:filter
  # The whole coordinator suite with every migration on real PostgreSQL 18 and the PDS18 roles created by
  # deploy/infrastructure/fleet-postgres.sql (tests/coordinator/pg-test.ts): migrations as the owner fleet (no superuser, no
  # BYPASSRLS), the store as fleet_app; the concurrency and load tests use the owner URL. PGlite runs as a superuser and
  # cannot catch privilege errors (the 426d1e2 deploy failed on one).
  postgres-roles:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The executor binary the end-to-end artifact tests run.
      - run: cargo build -p fleet-executor
      # One file at a time: the Postgres-backed tests share the database "fleet" (tests/coordinator/pg-test.ts).
      - run: pnpm exec tsx --test --test-concurrency=1 tests/coordinator/*.test.ts
        env:
          FLEET_TEST_PG: postgresql://postgres:postgres@localhost:5432
  comment:
    needs: build-test-design
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: design-report
      - name: Comment report summary on the PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'Design report not produced (see the job log).';
            try { report = fs.readFileSync('design-report/report.txt', 'utf8'); } catch {}
            const lines = report.split('\n');
            const short = lines.length > 60 ? lines.slice(0, 60).join('\n') + '\n… (full report in the design-report artifact)' : report;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `<!-- fleet-design-report -->\n**Design report** (warnings only, never blocks merge) · [run and artifacts](${run})\n\n\`\`\`\n${short}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const old = comments.find(c => c.body.includes('<!-- fleet-design-report -->'));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
