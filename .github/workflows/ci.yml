# Build and test gate the job; the design report never does (D6, D14).
# ubuntu-24.04 is pinned because Playwright has no Chromium build for ubuntu-latest (26.04) yet.
# Least privilege: no token scopes by default; the build job reads only, and only the comment job,
# which checks out no PR code, may write a PR comment.
name: ci
on:
  # edited: a ## Drift heading added to the description re-evaluates docs.drift (docs/designs/fleet-docs-governance.md#report).
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # A push to main runs the same gates; releases come from a v* tag (.github/workflows/release.yml).
  push:
    branches: [main]
permissions: {}
jobs:
  build-test-design:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Full history: the docs report diffs against the merge base or HEAD^.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out shared rules
        uses: actions/checkout@v4
        with:
          repository: taskqorg/specq
          ref: 13772b779be68103d0581d61a5f8fe7af2b92dd1
          path: .specq
          persist-credentials: false
      - name: Contract lint
        run: python3 .specq/engineering/scripts/contract_lint.py fleet.md
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Test requirement and risk report (warning only)
        if: always()
        continue-on-error: true
        run: |
          node scripts/test-rule-report.ts --self-check
          node scripts/test-rule-report.ts
      - name: Docs report (warning only)
        if: always()
        continue-on-error: true
        run: |
          node scripts/docs-report.ts --self-check
          node scripts/docs-report.ts
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # /api/health reports vcs.modified as dirty; a build from the CI checkout must be clean (untracked files count).
      - run: go version -m go/bin/fleet-coordinator | grep -q 'vcs.modified=false' || { git status --porcelain; exit 1; }
      # The executor's MCP adapter from Node against the Go binary: replayed stdio exchanges and artifact path confinement.
      # Its Go tests run in the go job.
      - run: (cd go && CGO_ENABLED=0 go build -o bin/fleet-executor ./executor) && FLEET_EXECUTOR_BIN="$PWD/go/bin/fleet-executor" node --test tests/executor/mcp-replay.test.ts tests/executor/artifact-tools.test.ts
      # pnpm test runs tests/go/run.sh: the Go binary on the runner's own PostgreSQL (tests/harness.ts starts it).
      - run: PATH="$(ls -d /usr/lib/postgresql/*/bin | tail -1):$PATH" pnpm test
      # Use-case registry drift (docs/designs/fleet-lab.md "Use-case registry and examples"): warns, never blocks. Only Fleet's own sources are
      # checked here; the other org repos are not checked out, so their entries report nothing.
      - name: Use-case drift (warning only)
        if: always()
        continue-on-error: true
        run: node scripts/lab-drift.ts
      - name: Install Chromium for the design checks
        if: always()
        run: pnpm exec playwright install --with-deps chromium
      - name: Design report (warnings only)
        if: always()
        continue-on-error: true
        run: |
          pnpm run book
          pnpm run check:design
          { echo '### Design report (warnings only)'; echo '```'; cat design-report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload design report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-report
          path: |
            design-report/
            docs/design-system/book/index.html
            docs/design-system/pages/mockups.html
          if-no-files-found: warn
  # The filter-path check (docs/designs/fleet-view-urls-and-list-path.md §4): its own job, so it does not slow build-test-design.
  filter-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: PATH="$(ls -d /usr/lib/postgresql/*/bin | tail -1):$PATH" pnpm run check:filter
  # The Conversations browser check (docs/designs/fleet-conversations.md, "Browser check"): asserts behaviour, reports timings.
  conversations-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: PATH="$(ls -d /usr/lib/postgresql/*/bin | tail -1):$PATH" pnpm run check:conversations
  # Go code (docs/designs/fleet-stack.md): vet, then one Linux job cross-builds every target without cgo.
  go:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Generated code is committed (go/contract): regenerating must not change it.
      - run: go generate ./... && { test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }; }
      - run: go vet ./... && go test ./...  # outside tests run in pnpm test (build-test-design)
      - name: Cross-build
        run: |
          mkdir -p dist
          for t in linux/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*} arch=${t#*/} ext=; [ "$os" = windows ] && ext=.exe
            file="dist/fleet-coordinator-$os-$arch$ext"
            GOOS=$os GOARCH=$arch go build -trimpath -o "$file" ./coordinator
            go version -m "$file" | grep -q 'CGO_ENABLED=0' || { echo "$file: cgo enabled"; exit 1; }
            (cd dist && sha256sum "${file#dist/}" | tee "${file#dist/}.sha256")
          done
          # The gateway (with its `guard` command), the executor and fleet-update: linux/amd64 and darwin/arm64 only
          # (Windows not built: executor process control needs its own port).
          for t in linux/amd64 darwin/arm64; do for cmd in gateway executor update; do
            os=${t%/*} arch=${t#*/} file="dist/fleet-$cmd-${t%/*}-${t#*/}"
            GOOS=$os GOARCH=$arch go build -trimpath -o "$file" "./$cmd"
            go version -m "$file" | grep -q 'CGO_ENABLED=0' || { echo "$file: cgo enabled"; exit 1; }
            (cd dist && sha256sum "${file#dist/}" | tee "${file#dist/}.sha256")
          done; done
      - name: govulncheck (warning only)
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-go-${{ github.sha }}
          path: go/dist/
          if-no-files-found: error
  comment:
    needs: build-test-design
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: design-report
      - name: Comment report summary on the PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'Design report not produced (see the job log).';
            try { report = fs.readFileSync('design-report/report.txt', 'utf8'); } catch {}
            const lines = report.split('\n');
            const short = lines.length > 60 ? lines.slice(0, 60).join('\n') + '\n… (full report in the design-report artifact)' : report;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Docs report: docs.drift lines drop when the current description has a ## Drift heading (read now, not at push).
            let docs = 'Docs report not produced (see the job log).';
            try { docs = fs.readFileSync('design-report/docs-report.txt', 'utf8'); } catch {}
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const drift = /^## Drift\s*$/m.test(pr.body ?? '');
            const docLines = docs.trimEnd().split('\n').filter(l => !(drift && / docs\.drift /.test(l)));
            const docsShort = docLines.length > 40 ? docLines.slice(0, 40).join('\n') + '\n… (full report: design-report/docs-report.txt in the artifact)' : docLines.join('\n');
            const issues = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/issues?q=is%3Aissue+is%3Aopen+label%3Adocs+fleet-docs-order`;
            const body = `<!-- fleet-design-report -->\n**Design report** (warnings only, never blocks merge) · [run and artifacts](${run})\n\n\`\`\`\n${short}\n\`\`\`\n\n**Docs report** (warnings only) · [open docs-order issue](${issues})\n\n\`\`\`\n${docsShort}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const old = comments.find(c => c.body.includes('<!-- fleet-design-report -->'));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
  # One open issue carries the docs report findings from main (docs/designs/fleet-docs-governance.md#from-warning-to-work):
  # updated each push, created with label docs when missing, closed when only docs.size and docs.delta remain.
  docs-order:
    needs: build-test-design
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: design-report
      - name: Update the docs-order issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try { report = fs.readFileSync('design-report/docs-report.txt', 'utf8'); } catch { core.warning('No docs report; issue left as is.'); return; }
            const findings = report.split('\n').filter(l => / docs\.[a-z]+ /.test(l) && !/ docs\.(size|delta) /.test(l));
            const marker = '<!-- fleet-docs-order -->';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'docs', per_page: 100 });
            const issue = open.find(i => (i.body ?? '').includes(marker));
            if (!findings.length) {
              if (issue) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              return;
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const head = report.split('\n').filter(l => /^(Docs report|Counts:|docs\/:)/.test(l)).join('\n');
            let list = findings.join('\n');
            // GitHub caps an issue body at 65536 characters; the full report stays in the run artifact.
            if (list.length > 60000) list = list.slice(0, 60000).replace(/\n[^\n]*$/, '') + '\n… (full report in the design-report artifact)';
            const body = `${marker}\nDocs report findings on \`${context.sha.slice(0, 12)}\` · [run and artifacts](${run}). An agent that edits \`docs/\` fixes the findings in the files it touches (AGENTS.md). Rules: docs/designs/fleet-docs-governance.md.\n\n\`\`\`\n${head}\n${list}\n\`\`\``;
            if (issue) { await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body }); return; }
            try { await github.rest.issues.getLabel({ ...context.repo, name: 'docs' }); }
            catch { await github.rest.issues.createLabel({ ...context.repo, name: 'docs', color: '0e8a16', description: 'Docs report findings' }); }
            await github.rest.issues.create({ ...context.repo, title: 'Docs order: docs report findings on main', body, labels: ['docs'] });
