# Jobs go, app and browser gate the merge; the design, docs and lab reports never do (D6, D14).
# A pull request runs only selection and the thin check; its heavy families are deferred to the merge queue, whose
# merge_group run executes them and is the qualification the release gate verifies (docs/designs/fleet-delivery-pipeline.md#selected-gate-qualification).
# ubuntu-24.04 is pinned because Playwright has no Chromium build for ubuntu-latest (26.04) yet.
# Least privilege: no token scopes by default; the build job reads only, and only the comment job,
# which checks out no PR code, may write a PR comment.
name: ci
on:
  # edited: a ## Drift heading added to the description re-evaluates docs.drift (docs/designs/fleet-docs-governance.md#report).
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # The merge queue tests each group on gh-readonly-queue/main/*; go, app and browser are its required checks
  # (docs/designs/fleet-delivery-pipeline.md#1-merge-ruleset-and-merge-queue). The push run feeds docs-order. The docs report
  # diffs a group commit against HEAD^, so each entry reports only its own change.
  merge_group:
  push:
    branches: [main]
permissions: {}
# A newer push or description edit of a pull request supersedes its running check; queue and main runs are never cancelled.
concurrency:
  # A description edit (edited) gets its own group: it never cancels a push's run, which previousGreen reads.
  group: ci-${{ github.event_name == 'pull_request' && github.event.action != 'edited' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true
jobs:
  selection:
    runs-on: ubuntu-24.04
    outputs:
      executed: ${{ steps.plan.outputs.executed }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out shared rules
        uses: actions/checkout@v4
        with:
          repository: taskqorg/specq
          ref: 1fc3716cc0971f8ca11f313d383db09751ffc132
          path: .specq
          persist-credentials: false
      - name: Contract lint
        run: python3 .specq/engineering/scripts/contract_lint.py fleet.md
      # Blocks on an outside test in tests/go/ that names no requirement or risk; warns for every other test.
      - name: Test requirement and risk report
        run: |
          node scripts/test-rule-report.ts --self-check
          node scripts/test-rule-report.ts --strict
      # Branches are rebased on main, never merged with it (docs/designs/fleet-delivery-pipeline.md#8-workers-merge-and-watch-their-own-pull-requests).
      # Pull requests only: a merge group has no number and its own commit is a merge.
      - name: No merge commits in the branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merges=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" -q '.[] | select(.parents | length > 1) | .sha[0:12]')
          [ -z "$merges" ] || { echo "Merge commits in this branch: $merges"; echo "Run: git fetch origin && git rebase origin/main && git push --force-with-lease"; exit 1; }
      - run: node --test tests/ui/test-selection.test.ts
      - name: Record qualified selection
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FLEET_TEST_FULL: ${{ vars.FLEET_TEST_FULL }}
        run: |
          node scripts/test-selection.ts > "$RUNNER_TEMP/test-selection.json"
          node -e 'const fs=require("node:fs"),p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/test-selection.json","utf8"));fs.appendFileSync(process.env.GITHUB_OUTPUT,"executed="+JSON.stringify(p.executed)+"\n")'
      - if: contains(fromJSON(steps.plan.outputs.executed), 'app')
        run: node --test tests/ui/view-url.test.ts
      - name: Documentation checks
        run: |
          node scripts/docs-report.ts --self-check
          node scripts/docs-report.ts
      - uses: actions/upload-artifact@v4
        with:
          name: test-selection
          path: ${{ runner.temp }}/test-selection.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error
  # Keep the required app status as the exact-candidate qualification boundary.
  app:
    needs: [selection, thin, go-tests, app-tests, browser-tests]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: test-selection
          path: ${{ runner.temp }}/qualification
      - name: Validate actual full execution
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const fs=require("node:fs"),r=JSON.parse(process.env.RESULTS);for(const f of ["app","go","browser"]){r[f]=r[f+"-tests"];delete r[f+"-tests"];}fs.writeFileSync(process.env.RUNNER_TEMP+"/qualification/test-results.json",JSON.stringify(r))'
          node scripts/test-selection.ts --verify "$RUNNER_TEMP/qualification/test-selection.json" "$RUNNER_TEMP/qualification/test-results.json"
      - uses: actions/upload-artifact@v4
        with:
          name: test-qualification
          path: ${{ runner.temp }}/qualification/
          retention-days: 7
          overwrite: true
          if-no-files-found: error
  # Thin pull request check: generated-code drift and vet; typecheck and the UI unit tests (sw.test.ts skips without a build).
# The full families repeat both in the merge queue.
  thin:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: [go, app]
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: matrix.part == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - if: matrix.part == 'go'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-vet-${{ hashFiles('go/**') }}
          restore-keys: go-vet-
      - if: matrix.part == 'go'
        run: cd go && go generate ./... && { test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }; }
      - if: matrix.part == 'go'
        run: cd go && go vet ./... && GOOS=windows GOARCH=amd64 go vet ./coordinator
      - if: matrix.part == 'app'
        uses: pnpm/action-setup@v4
      - if: matrix.part == 'app'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.part == 'app'
        run: pnpm install --frozen-lockfile && pnpm run typecheck && node --test tests/ui/*.test.ts
  go:
    needs: app
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require validated selection and results
        env:
          RESULT: ${{ needs.app.result }}
        run: |
          [ "$RESULT" = success ] || exit 1
          echo 'Qualified by app; test-qualification records executed and omitted families.'
  browser:
    needs: app
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require validated selection and results
        env:
          RESULT: ${{ needs.app.result }}
        run: |
          [ "$RESULT" = success ] || exit 1
          echo 'Qualified by app; test-qualification records executed and omitted families.'
  # Go (docs/designs/fleet-go-code.md), split into parallel parts so the family is never the critical path:
  # vet: generated-code drift, vet, a Windows compile of the coordinator; unit: the unit tests with -race;
  # vet also runs the executor's MCP adapter tests; outside-N: the outside tests against a -race coordinator on the runner's
  # PostgreSQL, sharded by file (tests/go/run.sh). The go wrapper sees the matrix as one result.
  # Node only as the test runner: the outside tests import node: builtins, so no pnpm install here.
  go-tests:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.executed), 'go')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ClickHouse only where a test talks to it: go/obs unit tests and tests/go/telemetry.test.ts (some outside shard).
        include:
          - {part: vet, clickhouse: false}
          - {part: unit, clickhouse: true}
          - {part: outside-0, clickhouse: true}
    env:
      GOFLAGS: -mod=readonly
      # Matrix entries outside-0..N-1 are the shards; run.sh fails on an index outside the total or an empty shard.
      # One shard: each shard pays ~80 s of containers, toolchain and -race build for ~15 s of tests, and the hosted
      # runner pool (20 concurrent jobs per org) is the merge queue's bottleneck, not one run's wall time.
      OUTSIDE_SHARDS: 1
      # The span store for go/obs and tests/go/telemetry.test.ts live tests (docs/designs/fleet-telemetry.md); same LTS as deploy/infrastructure/fleet-clickhouse.container.
      FLEET_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
    services:
      clickhouse:
        # An empty image skips the service.
        image: ${{ matrix.clickhouse && 'clickhouse/clickhouse-server:26.8' || '' }}
        env:
          CLICKHOUSE_DB: fleet
          CLICKHOUSE_USER: t
          CLICKHOUSE_PASSWORD: t
        ports: ["127.0.0.1:8123:8123"]
        options: >-
          --health-cmd "clickhouse client --user t --password t -q 'SELECT 1'"
          --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      # One build cache per part (vet, -race unit tests, the executor, each -race coordinator shard): a new entry when
      # Go sources change, restored from the newest same-part entry otherwise, so -race artifacts are reused, not rebuilt.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.part }}-${{ hashFiles('go/**') }}
          restore-keys: go-${{ matrix.part }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Generated code is committed (go/contract): regenerating must not change it.
      - if: matrix.part == 'vet'
        run: cd go && go generate ./... && { test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }; }
      - if: matrix.part == 'vet'
        run: cd go && go vet ./... && GOOS=windows GOARCH=amd64 go vet ./coordinator
      # -race needs cgo on Linux; release binaries stay CGO_ENABLED=0 (deploy/build-release.sh, app job).
      - if: matrix.part == 'unit'
        run: cd go && CGO_ENABLED=1 go test -race -count=1 ./...
      # The executor's MCP adapter from Node against the Go binary: replayed stdio exchanges and artifact path confinement.
      - if: matrix.part == 'vet'
        run: |
          cd go && CGO_ENABLED=0 go build -o bin/fleet-executor ./executor && cd ..
          FLEET_EXECUTOR_BIN="$PWD/go/bin/fleet-executor" node --test tests/executor/mcp-replay.test.ts tests/executor/artifact-tools.test.ts
      # The outside tests run a -race coordinator; GORACE halts it at the first race, so the test of that moment fails.
      # /api/health reports vcs.modified as dirty; a build from the CI checkout must be clean (untracked files count).
      - if: startsWith(matrix.part, 'outside-')
        run: |
          cd go && CGO_ENABLED=1 go build -race -o bin/fleet-coordinator ./coordinator && cd ..
          go version -m go/bin/fleet-coordinator | grep -q 'vcs.modified=false' || { git status --porcelain; exit 1; }
          PATH="$(ls -d /usr/lib/postgresql/*/bin | tail -1):$PATH" GORACE=halt_on_error=1 tests/go/run.sh "${PART#outside-}" "$OUTSIDE_SHARDS"
        env:
          PART: ${{ matrix.part }}
  # App and release: contract lint, test-rule report, typecheck and bundle, UI unit tests, then the release tarballs of
  # every target from deploy/build-release.sh, the same script and flags the release workflow uses.
  app-tests:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.executed), 'app')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm run app:build
      - run: node --test tests/ui/*.test.ts
      - name: Pack the release
        run: |
          mkdir release && deploy/build-release.sh HEAD release "0.0.0-${GITHUB_SHA::12}" "" linux/amd64 darwin/arm64
          mkdir t && tar -xzf release/fleet-*-linux-amd64.tgz -C t
          for b in t/fleet-*; do go version -m "$b" | grep -q 'CGO_ENABLED=0' || { echo "$b: cgo enabled"; exit 1; }; done
          for b in fleet-coordinator fleet-gateway fleet-executor fleet-update; do (cd /tmp && env -i "$GITHUB_WORKSPACE/t/$b" selftest); done
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-release-${{ github.sha }}
          path: release/
          retention-days: 1
          overwrite: true
          if-no-files-found: error
  # Browser: one build, Chromium from a cache keyed on the Playwright version, then every browser check in sequence:
  # filter path (fleet-view-urls-and-list-path.md §4), Conversations (fleet-conversations.md "Browser check"), the
  # design book and report. The docs and design reports warn only (D6, D14).
  browser-tests:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.executed), 'browser')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Full history: the docs report diffs against the merge base or HEAD^.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The UI tree these browser checks serve: a UI-only release signs and publishes it (release.yml publish). Only
      # merge queue and push runs can qualify a release.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: fleet-ui
          path: dist/app/
          retention-days: 30
          overwrite: true
          if-no-files-found: error
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium
      # The hosted Azure resolver returned SERVFAIL for Ubuntu while public DNS answered.
      # Change only this ephemeral job's runtime DNS, and only after checking the alternate.
      - name: Recover Ubuntu DNS when the runner resolver fails
        run: |
          recover=false
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if ! getent ahostsv4 "$host" > /dev/null; then
              recover=true
              break
            fi
          done
          if "$recover"; then
            for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com github.com; do
              answer=$(dig @1.1.1.1 "$host" A +time=3 +tries=1 +noall +comments +answer)
              grep -q 'status: NOERROR' <<< "$answer"
              grep -Eq '[[:space:]]IN[[:space:]]+A[[:space:]]+[0-9]' <<< "$answer"
            done
            link=$(ip -4 route show default | awk '{print $5; exit}')
            test -n "$link"
            sudo resolvectl dns "$link" 1.1.1.1
            sudo resolvectl flush-caches
            resolvectl dns "$link"
            curl --fail --head https://archive.ubuntu.com/ubuntu/dists/noble/InRelease
            curl --fail --head https://security.ubuntu.com/ubuntu/dists/noble-security/InRelease
          fi
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com github.com; do
            getent ahostsv4 "$host"
          done
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: PATH="$(ls -d /usr/lib/postgresql/*/bin | tail -1):$PATH" node tests/ui/filter.check.ts --assert
      - run: PATH="$(ls -d /usr/lib/postgresql/*/bin | tail -1):$PATH" node tests/ui/conversations.check.ts
      - run: PATH="$(ls -d /usr/lib/postgresql/*/bin | tail -1):$PATH" node tests/ui/lab-create.check.ts
  # Diagnostics only: pull requests (comment) and main pushes (docs-order); never a merge queue run's runner slot.
  reports:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Full history: the docs report diffs against the merge base or HEAD^.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium
      # The hosted Azure resolver returned SERVFAIL for Ubuntu while public DNS answered.
      # Change only this ephemeral job's runtime DNS, and only after checking the alternate.
      - name: Recover Ubuntu DNS when the runner resolver fails
        run: |
          recover=false
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if ! getent ahostsv4 "$host" > /dev/null; then
              recover=true
              break
            fi
          done
          if "$recover"; then
            for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com github.com; do
              answer=$(dig @1.1.1.1 "$host" A +time=3 +tries=1 +noall +comments +answer)
              grep -q 'status: NOERROR' <<< "$answer"
              grep -Eq '[[:space:]]IN[[:space:]]+A[[:space:]]+[0-9]' <<< "$answer"
            done
            link=$(ip -4 route show default | awk '{print $5; exit}')
            test -n "$link"
            sudo resolvectl dns "$link" 1.1.1.1
            sudo resolvectl flush-caches
            resolvectl dns "$link"
            curl --fail --head https://archive.ubuntu.com/ubuntu/dists/noble/InRelease
            curl --fail --head https://security.ubuntu.com/ubuntu/dists/noble-security/InRelease
          fi
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com github.com; do
            getent ahostsv4 "$host"
          done
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Docs report (warning only)
        if: always()
        continue-on-error: true
        run: |
          node scripts/docs-report.ts --self-check
          node scripts/docs-report.ts
      - name: govulncheck (warning only)
        continue-on-error: true
        run: cd go && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      # Use-case registry drift (docs/designs/fleet-lab.md "Use-case registry and examples"): warns, never blocks. Only Fleet's own sources are
      # checked here; the other org repos are not checked out, so their entries report nothing.
      - name: Use-case drift (warning only)
        if: always()
        continue-on-error: true
        run: node scripts/lab-drift.ts
      - name: Design report (warnings only)
        if: always()
        continue-on-error: true
        run: |
          pnpm run book
          pnpm run check:design
          { echo '### Design report (warnings only)'; echo '```'; cat design-report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload design report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-report
          path: |
            design-report/
            docs/design-system/book/index.html
            docs/design-system/pages/mockups.html
          retention-days: 7
          overwrite: true
          if-no-files-found: warn
  comment:
    needs: reports
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: design-report
      - name: Comment report summary on the PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'Design report not produced (see the job log).';
            try { report = fs.readFileSync('design-report/report.txt', 'utf8'); } catch {}
            const lines = report.split('\n');
            const short = lines.length > 60 ? lines.slice(0, 60).join('\n') + '\n… (full report in the design-report artifact)' : report;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Docs report: docs.drift lines drop when the current description has a ## Drift heading (read now, not at push).
            let docs = 'Docs report not produced (see the job log).';
            try { docs = fs.readFileSync('design-report/docs-report.txt', 'utf8'); } catch {}
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const drift = /^## Drift\s*$/m.test(pr.body ?? '');
            const docLines = docs.trimEnd().split('\n').filter(l => !(drift && / docs\.drift /.test(l)));
            const docsShort = docLines.length > 40 ? docLines.slice(0, 40).join('\n') + '\n… (full report: design-report/docs-report.txt in the artifact)' : docLines.join('\n');
            const issues = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/issues?q=is%3Aissue+is%3Aopen+label%3Adocs+fleet-docs-order`;
            const body = `<!-- fleet-design-report -->\n**Design report** (warnings only, never blocks merge) · [run and artifacts](${run})\n\n\`\`\`\n${short}\n\`\`\`\n\n**Docs report** (warnings only) · [open docs-order issue](${issues})\n\n\`\`\`\n${docsShort}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const old = comments.find(c => c.body.includes('<!-- fleet-design-report -->'));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
  # One open issue carries the docs report findings from main (docs/designs/fleet-docs-governance.md#from-warning-to-work):
  # updated each push, created with label docs when missing, closed when only docs.size and docs.delta remain.
  docs-order:
    needs: reports
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: design-report
      - name: Update the docs-order issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try { report = fs.readFileSync('design-report/docs-report.txt', 'utf8'); } catch { core.warning('No docs report; issue left as is.'); return; }
            const findings = report.split('\n').filter(l => / docs\.[a-z]+ /.test(l) && !/ docs\.(size|delta) /.test(l));
            const marker = '<!-- fleet-docs-order -->';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'docs', per_page: 100 });
            const issue = open.find(i => (i.body ?? '').includes(marker));
            if (!findings.length) {
              if (issue) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              return;
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const head = report.split('\n').filter(l => /^(Docs report|Counts:|docs\/:)/.test(l)).join('\n');
            let list = findings.join('\n');
            // GitHub caps an issue body at 65536 characters; the full report stays in the run artifact.
            if (list.length > 60000) list = list.slice(0, 60000).replace(/\n[^\n]*$/, '') + '\n… (full report in the design-report artifact)';
            const body = `${marker}\nDocs report findings on \`${context.sha.slice(0, 12)}\` · [run and artifacts](${run}). An agent that edits \`docs/\` fixes the findings in the files it touches (AGENTS.md). Rules: docs/designs/fleet-docs-governance.md.\n\n\`\`\`\n${head}\n${list}\n\`\`\``;
            if (issue) { await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body }); return; }
            try { await github.rest.issues.getLabel({ ...context.repo, name: 'docs' }); }
            catch { await github.rest.issues.createLabel({ ...context.repo, name: 'docs', color: '0e8a16', description: 'Docs report findings' }); }
            await github.rest.issues.create({ ...context.repo, title: 'Docs order: docs report findings on main', body, labels: ['docs'] });
