# The two required checks, go and app, run on every pull request, merge group and push to main: no selection, no path
# filter, about a minute each (docs/designs/fleet-delivery-pipeline.md#checks-per-change). Their commands are
# scripts/check.sh, the same as locally. The release builds after the merge (release.yml). The design, docs and lab
# reports never gate (D6, D14).
# ubuntu-24.04 is pinned because Playwright has no Chromium build for ubuntu-latest (26.04) yet.
# Least privilege: no token scopes by default; the check jobs read only, and only the comment job,
# which checks out no PR code, may write a PR comment.
name: ci
on:
  # Description edits (## Drift) are handled by pr-drift-comment.yml so bot PR body edits never trigger duplicate CI runs.
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue tests each group on gh-readonly-queue/main/*; go, app and code-review are its required checks
  # (docs/designs/fleet-delivery-pipeline.md#1-merge-ruleset-and-merge-queue). The push run feeds docs-order and the
  # release gate. The docs report diffs a group commit against HEAD^, so each entry reports only its own change.
  merge_group:
  push:
    branches: [main]
  # The managed CLI update (harness-pins.yml) writes with its GITHUB_TOKEN, which starts no workflow: it dispatches this
  # one on its pull request's head and, when needed, on the queue's group branch, so go and app report there.
  workflow_dispatch:
permissions: {}
# A newer push of a pull request supersedes its running check; queue and main runs are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true
jobs:
  # Generated code unchanged, vet, the four binaries, go test (design rules and pure logic), the smoke on the real
  # coordinator against the runner's PostgreSQL (tests/trial/run.ts).
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
      # One build cache for every event: a pull request restores main's, a miss saves its own.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-check-${{ hashFiles('go/**') }}
          restore-keys: go-check-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/check.sh go
  # Contract lint, a branch without merge commits, typecheck and bundle, the app unit tests. A merge group or push uploads
  # the bundle as fleet-ui for the UI-only release (release.yml).
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out shared rules
        uses: actions/checkout@v4
        with:
          repository: taskqorg/specq
          ref: 1fc3716cc0971f8ca11f313d383db09751ffc132
          path: .specq
          persist-credentials: false
      - name: Contract lint
        run: python3 .specq/engineering/scripts/contract_lint.py fleet.md
      # Branches are rebased on main, never merged with it (docs/designs/fleet-delivery-pipeline.md#8-workers-merge-and-watch-their-own-pull-requests).
      # Pull requests only: a merge group has no number and its own commit is a merge.
      - name: No merge commits in the branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merges=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" -q '.[] | select(.parents | length > 1) | .sha[0:12]')
          [ -z "$merges" ] || { echo "Merge commits in this branch: $merges"; echo "Run: git fetch origin && git rebase origin/main && git push --force-with-lease"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: scripts/check.sh app
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fleet-ui
          path: dist/app/
          retention-days: 7
          overwrite: true
          if-no-files-found: error
  reports:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Full history: the docs report diffs against the merge base or HEAD^.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: ./.github/actions/go
      # The go job's build cache, restore only.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-check-${{ hashFiles('go/**') }}
          restore-keys: go-check-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      # No apt: the hosted image carries Chromium's libraries; of Playwright's install-deps list it lacks only fallback
      # fonts (fonts-unifont, xfonts-cyrillic, xfonts-scalable), and no check compares pixels.
      - id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium
      # The hosted Azure resolver returned SERVFAIL for Ubuntu while public DNS answered.
      # Change only this ephemeral job's runtime DNS, and only after checking the alternate.
      - name: Recover Ubuntu DNS when the runner resolver fails
        run: |
          recover=false
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if ! getent ahostsv4 "$host" > /dev/null; then
              recover=true
              break
            fi
          done
          if "$recover"; then
            for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com github.com; do
              answer=$(dig @1.1.1.1 "$host" A +time=3 +tries=1 +noall +comments +answer)
              grep -q 'status: NOERROR' <<< "$answer"
              grep -Eq '[[:space:]]IN[[:space:]]+A[[:space:]]+[0-9]' <<< "$answer"
            done
            link=$(ip -4 route show default | awk '{print $5; exit}')
            test -n "$link"
            sudo resolvectl dns "$link" 1.1.1.1
            sudo resolvectl flush-caches
            resolvectl dns "$link"
            curl --fail --head https://archive.ubuntu.com/ubuntu/dists/noble/InRelease
            curl --fail --head https://security.ubuntu.com/ubuntu/dists/noble-security/InRelease
          fi
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com github.com; do
            getent ahostsv4 "$host"
          done
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Docs report (warning only)
        if: always()
        continue-on-error: true
        run: |
          node scripts/docs-report.ts --self-check
          node scripts/docs-report.ts
      - name: govulncheck (warning only)
        continue-on-error: true
        run: cd go && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      # Use-case registry drift (docs/designs/fleet-lab.md "Use-case registry and examples"): warns, never blocks. Only Fleet's own sources are
      # checked here; the other org repos are not checked out, so their entries report nothing.
      - name: Use-case drift (warning only)
        if: always()
        continue-on-error: true
        run: node scripts/lab-drift.ts
      - name: Design report (warnings only)
        if: always()
        continue-on-error: true
        run: |
          pnpm run check:design
          { echo '### Design report (warnings only)'; echo '```'; cat design-report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload design report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-report
          path: |
            design-report/
            docs/design-system/book/index.html
            docs/design-system/pages/mockups.html
            docs/design-system/explorations/open-questions-01.html
          retention-days: 7
          overwrite: true
          if-no-files-found: warn
  # The PR comment leads with what this pull request changed against the latest main design-report artifact and folds the
  # standing report (scripts/design-report-comment.ts). Every step is information: none fails the run.
  comment:
    needs: reports
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/design-report-comment.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: design-report
      - name: Comment builder self-check (warning only)
        continue-on-error: true
        run: node scripts/design-report-comment.ts --self-check
      - name: Write the comment against the main baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUES: ${{ github.server_url }}/${{ github.repository }}/issues?q=is%3Aissue+is%3Aopen+label%3Adocs+fleet-docs-order
        run: |
          # Baseline: the newest unexpired design-report artifact of a main run.
          label='no unexpired design-report artifact from a main run'
          art=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=design-report&per_page=100" \
            --jq '[.artifacts[] | select(.workflow_run.head_branch == "main" and (.expired | not))][0] | "\(.workflow_run.id) \(.workflow_run.head_sha)"' 2>/dev/null || true)
          if [ -n "$art" ] && [ "$art" != "null null" ] && gh run download "${art% *}" -n design-report -D baseline 2>/dev/null; then
            sha=${art#* }
            label="main \`${sha:0:12}\` ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${art% *}))"
          fi
          # docs.drift lines drop when the current description has a ## Drift heading (read now, not at push).
          drift=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' | grep -qE '^## Drift[[:space:]]*$' && echo --drop-drift || true)
          node scripts/design-report-comment.ts --pr design-report --base baseline/design-report --base-label "$label" \
            --run "$RUN" --issues "$ISSUES" $drift --out comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment report summary on the PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '<!-- fleet-design-report -->\n**Design report** · comment not produced (see the job log).';
            try { body = fs.readFileSync('comment.md', 'utf8'); } catch {}
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const old = comments.find(c => c.body.includes('<!-- fleet-design-report -->'));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
  # One open issue carries the docs report findings from main (docs/designs/fleet-docs-governance.md#from-warning-to-work):
  # updated each push, created with label docs when missing, closed when only docs.size and docs.delta remain.
  docs-order:
    needs: reports
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: design-report
      - name: Update the docs-order issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try { report = fs.readFileSync('design-report/docs-report.txt', 'utf8'); } catch { core.warning('No docs report; issue left as is.'); return; }
            const findings = report.split('\n').filter(l => / docs\.[a-z]+ /.test(l) && !/ docs\.(size|delta) /.test(l));
            const marker = '<!-- fleet-docs-order -->';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'docs', per_page: 100 });
            const issue = open.find(i => (i.body ?? '').includes(marker));
            if (!findings.length) {
              if (issue) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              return;
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const head = report.split('\n').filter(l => /^(Docs report|Counts:|docs\/:)/.test(l)).join('\n');
            let list = findings.join('\n');
            // GitHub caps an issue body at 65536 characters; the full report stays in the run artifact.
            if (list.length > 60000) list = list.slice(0, 60000).replace(/\n[^\n]*$/, '') + '\n… (full report in the design-report artifact)';
            const body = `${marker}\nDocs report findings on \`${context.sha.slice(0, 12)}\` · [run and artifacts](${run}). An agent that edits \`docs/\` fixes the findings in the files it touches (AGENTS.md). Rules: docs/designs/fleet-docs-governance.md.\n\n\`\`\`\n${head}\n${list}\n\`\`\``;
            if (issue) { await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body }); return; }
            try { await github.rest.issues.getLabel({ ...context.repo, name: 'docs' }); }
            catch { await github.rest.issues.createLabel({ ...context.repo, name: 'docs', color: '0e8a16', description: 'Docs report findings' }); }
            await github.rest.issues.create({ ...context.repo, title: 'Docs order: docs report findings on main', body, labels: ['docs'] });
