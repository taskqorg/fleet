# Chromium's system packages for cached Playwright browsers. The hosted image already carries most of them: apt installs
# only the packages of Playwright's own install-deps list (libraries and fonts) that are missing; the full install-deps
# runs when the list cannot be read.
name: Chromium dependencies
description: playwright install-deps chromium, skipped when every package is installed
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        pkgs=$(pnpm exec playwright install-deps --dry-run chromium | sed -n 's/.*--no-install-recommends \([^"]*\).*/\1/p')
        missing=$(for p in $pkgs; do dpkg-query -W -f='${db:Status-Status}' "$p" 2>/dev/null | grep -qx installed || echo "$p"; done)
        if [ -n "$pkgs" ] && [ -z "$missing" ]; then echo "all $(wc -w <<< "$pkgs") Chromium packages installed"
        elif [ -n "$pkgs" ]; then
          # Only the missing ones (the image lacks fonts-unifont); the apt index refresh only when the image's is stale.
          echo "missing: $missing"
          sudo apt-get install -y --no-install-recommends $missing || { sudo apt-get update && sudo apt-get install -y --no-install-recommends $missing; }
        else pnpm exec playwright install-deps chromium; fi
