# Chromium's system packages for cached Playwright browsers. The hosted image already carries most of them: only the
# packages of Playwright's own install-deps list (libraries and fonts) that are missing are installed, from .debs kept
# in the Actions cache (keyed on that list), downloaded once by apt. The full install-deps runs when the list cannot be
# read.
name: Chromium dependencies
description: playwright install-deps chromium, only the missing packages, from cached .debs
runs:
  using: composite
  steps:
    - id: list
      shell: bash
      run: |
        pkgs=$(pnpm exec playwright install-deps --dry-run chromium | sed -n 's/.*--no-install-recommends \([^"]*\).*/\1/p')
        missing=$(for p in $pkgs; do dpkg-query -W -f='${db:Status-Status}' "$p" 2>/dev/null | grep -qx installed || echo "$p"; done | xargs)
        echo "pkgs=$(wc -w <<< "$pkgs")" >> "$GITHUB_OUTPUT"
        echo "missing=$missing" >> "$GITHUB_OUTPUT"
        echo "missing: ${missing:-none} of $(wc -w <<< "$pkgs")"
    - if: steps.list.outputs.pkgs != '0' && steps.list.outputs.missing != ''
      id: debs
      uses: actions/cache@v4
      with:
        path: ~/.cache/chromium-debs
        key: chromium-debs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.list.outputs.missing }}
    - if: steps.list.outputs.pkgs != '0' && steps.list.outputs.missing != ''
      shell: bash
      env:
        MISSING: ${{ steps.list.outputs.missing }}
        HIT: ${{ steps.debs.outputs.cache-hit }}
      run: |
        dir=$HOME/.cache/chromium-debs
        if [ "$HIT" != true ] || ! ls "$dir"/*.deb >/dev/null 2>&1; then
          mkdir -p "$dir/partial"
          get() { sudo apt-get install -y --download-only --no-install-recommends -o Dir::Cache::archives="$dir" $MISSING; }
          get || { sudo apt-get update && get; }
          sudo rm -rf "$dir/partial" "$dir/lock"; sudo chown -R "$USER" "$dir"
        fi
        sudo dpkg -i "$dir"/*.deb
    - if: steps.list.outputs.pkgs == '0'
      shell: bash
      run: pnpm exec playwright install-deps chromium
