.sk-row i+i{width:20%}
.empty{padding:var(--space-6) var(--space-4);text-align:center;color:var(--fg-muted)}
.empty p{margin:0 0 var(--space-3)}
.err-banner{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--line);color:var(--danger-fg)}
.stale{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--font-size-sm);color:var(--fg-muted)}

@media (max-width:640px){
  .btn,.chip,.saved-chip,.seg,.tabs button{min-height:var(--size-hit-phone)}
  .setting{grid-template-columns:1fr}.setting .help{grid-column:1}
}
@media (pointer:coarse){.btn,.chip button,.tw,.pill{min-height:var(--size-hit-phone);min-width:var(--size-hit-phone)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Tooltip (OR-20): small, contextual, distinct floating surface (OR-16) */
.tooltip{position:fixed;z-index:10;max-width:var(--size-tip);transform:translate(-50%,calc(-100% - var(--space-2)));padding:var(--space-1) var(--space-2);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--float);color:var(--fg);box-shadow:var(--elevation-popover);font-size:var(--font-size-sm);line-height:var(--font-line);pointer-events:none}
.tooltip.below{transform:translate(-50%,var(--space-2))}
.vl-row .id{margin-left:0}
.vl-row .btn.icon-only{border-color:transparent;background:none}.vl-row .btn.icon-only:hover{background:var(--hover)}

/* Split button */
.split{position:relative;display:inline-flex}
.split>.btn:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.split-more{width:var(--size-badge);padding:0;justify-content:center;border-left-width:0;border-top-left-radius:0;border-bottom-left-radius:0}
.split.primary .split-more{border-left:1px solid var(--on-accent)}
.menu{position:absolute;top:calc(100% + var(--space-1));right:0;z-index:5;display:flex;flex-direction:column;min-width:var(--size-label);padding:var(--space-1);background:var(--float);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--elevation-popover)}
.menu button{display:flex;align-items:center;gap:var(--space-2);height:var(--size-control);padding:0 var(--space-3);border:0;border-radius:var(--radius-sm);background:none;text-align:left;cursor:pointer;white-space:nowrap}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}

/* State counters */
.counters{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.counter{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--size-chip);padding:0 var(--space-2);border:1px solid transparent;border-radius:var(--radius-md);background:var(--tone-bg);color:var(--tone-fg);cursor:pointer;font-size:var(--font-size-sm)}
.counter .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.counter.zero{background:none;color:var(--fg-muted)}
.counter.on{border-color:var(--tone-fg);box-shadow:inset 0 0 0 1px var(--tone-fg)}

/* Group header */
.group-h{display:flex;align-items:center;gap:var(--space-2);width:100%;height:100%;padding:0;border:0;background:none;color:var(--tone-fg);cursor:pointer;font-size:var(--font-size-sm)}
.group-h b{color:var(--fg)}
.group-h .num{margin-left:auto;color:var(--fg-muted)}
.vl-row.grp{grid-template-columns:1fr;background:var(--surface-sunken)}

/* Presets */
.presets{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1)}
.preset{display:inline-flex;align-items:center;border-radius:var(--radius-md)}
.preset button{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--size-chip);padding:0 var(--space-2);border:0;border-radius:var(--radius-md);background:none;color:var(--fg-muted);font-size:var(--font-size-sm);cursor:pointer}
.preset .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.preset .x{width:var(--size-chip);padding:0;justify-content:center}
.preset:hover{background:var(--hover)}
.preset.on{background:var(--selected)}.preset.on button{color:var(--fg)}
.naming{display:inline-flex;gap:var(--space-1)}
.naming input{width:var(--size-input);height:var(--size-chip);padding:0 var(--space-2);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}

/* Navigation rail */
.rail{display:flex;flex-direction:column;gap:var(--space-3);width:var(--size-rail);min-height:0;overflow-y:auto;padding:var(--space-3) var(--space-2);border-right:1px solid var(--line);background:var(--rail)}
.rail>*{flex:none}
.rail-head{display:flex;align-items:center;gap:var(--space-2);padding-left:var(--space-3)}
.rail-head .btn{border-color:transparent;background:none}
.rail.mini{width:auto;padding:var(--space-2) var(--space-1)}
.rail.mini .nm,.rail.mini .rail-h,.rail.mini .rail-search,.rail.mini .nav-pin,.rail.mini .brand,.rail.mini .waiting{display:none}
.rail.mini .rail-head{padding:0;justify-content:center}
.rail.mini .nav-i a{padding:0 var(--space-2);position:relative}
.rail.mini .nav-count{position:absolute;top:calc(-1 * var(--space-1));right:calc(-1 * var(--space-1));padding:0 var(--space-1)}
.rail-g{list-style:none;margin:0;padding:0}
.rail-g.pinned{padding-bottom:var(--space-3);border-bottom:1px solid var(--line)}
.rail-h{padding:var(--space-1) var(--space-3);font-size:var(--font-size-xs);color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em}
.nav-i{display:flex;align-items:center;border-radius:var(--radius-md)}
.nav-i a{flex:1;display:flex;align-items:center;gap:var(--space-2);min-width:0;height:var(--size-control);padding:0 var(--space-3);color:var(--fg-muted);text-decoration:none}
.nav-i .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i:hover{background:var(--hover)}
.nav-i.cur{background:var(--selected)}.nav-i.cur a{color:var(--fg)}
.nav-count{padding:0 var(--space-2);border-radius:var(--radius-pill);background:var(--tone-bg);color:var(--tone-fg);font-family:var(--font-mono);font-size:var(--font-size-xs)}
.nav-pin{display:inline-flex;align-items:center;justify-content:center;width:var(--size-control);height:var(--size-control);border:0;background:none;color:var(--fg-muted);cursor:pointer;opacity:0}
.nav-pin .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.nav-i:hover .nav-pin,.nav-pin:focus-visible{opacity:1}
.rail-search{flex:none;margin:0 var(--space-1)}
@media (pointer:coarse){.nav-pin{opacity:1}}

/* Stat strip */
.stats{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.stat{display:inline-flex}
.stat>a,.stat{align-items:center;gap:var(--space-2);color:inherit;text-decoration:none}
.stat{padding:var(--space-2) var(--space-3);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
.stat>a{display:inline-flex}
.stat .icon{color:var(--fg-muted)}
.stat.toned .icon,.stat.toned .sv{color:var(--tone-fg)}
.stat .sv{font-size:var(--font-size-lg);font-family:var(--font-mono)}
.stat .of{color:var(--fg-muted);font-size:var(--font-size-sm)}
.stat .sl{color:var(--fg-muted);font-size:var(--font-size-sm)}
/* OR-26: the whole row opens the item; the shell forwards the click to the row link */
.row-link{color:inherit;text-decoration:none}
.vl-row:has(.row-link){cursor:pointer}
.vl-row.sel{background:var(--selected);box-shadow:inset 3px 0 var(--accent)}
.seg-group{display:inline-flex;gap:var(--space-1)}

/* App shell and page layout (patterns/app-shell.md) */
/* Three columns (OR-24). The shell alone takes the viewport height; each column has at most one scroller (OR-25). */
.shell{display:grid;grid-template-columns:auto minmax(0,1fr);height:100dvh;overflow:hidden}
.brand{font-size:var(--font-size-lg)}
.waiting{text-decoration:none;font-size:var(--font-size-sm);padding:var(--space-1) var(--space-3)}
.shell-main{min-width:0;min-height:0;overflow-y:auto;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);background:var(--surface)}
.shell-main>*{flex:none}
.shell-main:has(>.split-view){padding:0;gap:0;overflow:hidden}
.shell-main>.split-view{flex:1;min-height:0}
.page-h{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)}
.page-h h1{margin:0;font-size:var(--font-size-xl);font-weight:var(--font-weight-bold)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:var(--font-size-md);font-weight:var(--font-weight-bold)}
.panel>.setting{padding-left:var(--space-4);padding-right:var(--space-4)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:var(--space-4);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--space-3)}
.panel>.stack{padding:var(--space-3)}
.kv{list-style:none;margin:0;padding:var(--space-2) var(--space-4)}
.kv li{display:flex;align-items:center;gap:var(--space-3);min-height:var(--size-row)}
.kv .k{min-width:var(--size-clock);font-weight:var(--font-weight-medium)}
.kv .v{font-family:var(--font-mono)}
/* Control column and work area (patterns/list-detail.md) */
.split-view{display:grid;grid-template-columns:var(--size-ctl) minmax(0,1fr)}
.split-list{display:flex;flex-direction:column;min-width:0;min-height:0;overflow-y:auto;border-right:1px solid var(--line);background:var(--bg)}
.split-list>*{flex:none}
.split-list>.page-h{padding:var(--space-4) var(--space-4) var(--space-2)}
.split-list>.panel{border:0;border-radius:0;background:none}
.split-list>.stats{padding:0 var(--space-4) var(--space-2)}
.split-list>.panel:has(.vl),.split-list .list-view,.split-list .vl-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
/* OR-25: a control column that holds a virtual list leaves scrolling to the list, so the two never nest. ponytail: in a very short window the head above the list clips; give the head its own row limit if that shows up. */
.split-list:has(.vl){overflow-y:hidden}
.detail{display:flex;flex-direction:column;gap:var(--space-3);min-width:0;min-height:0;overflow-y:auto;padding:var(--space-4) var(--space-6);background:var(--surface)}
.detail>*{flex:none}
.work-idle{display:grid;min-width:0;min-height:0;background:var(--surface)}
.work-empty{place-items:center}
.detail-h{display:flex;align-items:center;gap:var(--space-2)}
.detail-title{margin:0;font-size:var(--font-size-xl);font-weight:var(--font-weight-bold)}
.state-line{display:flex;align-items:center;gap:var(--space-3)}
.detail-tabs{border-bottom:1px solid var(--line);padding-bottom:var(--space-1)}
.vl-row.static{position:relative;transform:none;height:var(--size-row);cursor:default}
.list-view .vl{height:var(--list-height,var(--size-list))}
@media (max-width:1100px){
  .cols,.split-view{grid-template-columns:minmax(0,1fr)}
  .split-view.has-detail>.split-list,.split-view:not(.has-detail)>.work-idle{display:none}
}
@media (max-width:760px){
  .rail{width:auto;padding:var(--space-2) var(--space-1)}
  .rail .nm,.rail .rail-h,.rail-search,.rail .nav-pin,.rail .brand,.rail .waiting,.rail-head{display:none}
  .rail .nav-i a{padding:0 var(--space-2);position:relative}
  .rail .nav-count{position:absolute;top:0;right:0;padding:0 var(--space-1)}
  .shell-main{padding:var(--space-3)}
}
.vl-head .r{text-align:right}

/* Harness marks and counts, stage chip, outcome block, detail sections (D11) */
.harness{display:inline-flex;color:var(--fg-muted)}
.harness-counts{display:inline-flex;gap:var(--space-2);align-items:center}
.hc{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--font-size-sm);color:var(--fg-muted)}
.hc .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.hc .num{color:var(--fg)}
.outcome{display:flex;gap:var(--space-2);align-items:flex-start;padding:var(--space-3);background:var(--surface-sunken);border-radius:var(--radius-md)}
.outcome-b{flex:1;min-width:0}
.outcome p{margin:0 0 var(--space-2)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.outcome-meta{display:flex;flex-wrap:wrap;gap:var(--space-1);align-items:center}
.chip.in{gap:var(--space-1);padding-right:var(--space-2)}
.reqs{list-style:none;margin:var(--space-2) 0;padding:0}
.reqs li{display:flex;gap:var(--space-2);align-items:center;min-height:var(--size-control)}
.dsec{padding:var(--space-2) 0;border-top:1px solid var(--line-soft)}
.dsec h3{margin:0 0 var(--space-1);font-size:var(--font-size-sm);color:var(--fg-muted);font-weight:var(--font-weight-medium)}
.kv-row{display:flex;align-items:center;gap:var(--space-2);min-height:var(--size-row)}
.vl-row .lead{display:flex;align-items:center}
.vl-row .tt{display:flex;align-items:baseline;gap:var(--space-2);min-width:0}
.vl-row .tt .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vl-row .tt .id{margin:0;flex:none}
.vl-row .p0{color:var(--danger-fg);font-family:var(--font-mono);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}
.stack-pad{padding:0 var(--space-4) var(--space-2)}
.counter.sigma .sig{font-weight:var(--font-weight-bold)}
.counter.sigma{margin-right:var(--space-1)}

/* D14 review fixes */
.legend{white-space:normal}
.kv .k{white-space:nowrap}
.chip-age .icon{width:var(--size-icon-sm);height:var(--size-icon-sm);margin-right:var(--space-1);vertical-align:-2px}
.chip-age.alert{display:inline-flex;align-items:center}
.seg-group{align-items:center}.seg-label{font-size:var(--font-size-sm);color:var(--fg-muted);margin-right:var(--space-1)}
.skip{position:absolute;left:var(--space-2);top:-100px;z-index:20;padding:var(--space-2) var(--space-3);background:var(--accent);color:var(--on-accent);border-radius:var(--radius-md)}
.skip:focus{top:var(--space-2)}
.shell-main:focus{outline:none}
.detail:focus{outline:none}
@media (max-width:760px){.rail .nav-count{top:calc(-1 * var(--space-1));right:calc(-1 * var(--space-1))}}
/* M2: 44 px targets on touch for row pins, row links, nav links (owner exception) */
@media (pointer:coarse){
  .vl-row .btn.icon-only,.nav-i a,.nav-pin,.counter,.seg,.preset button,.saved-chip,.tabs button,.menu button{min-height:var(--size-hit-phone);min-width:var(--size-hit-phone)}
  .row-link{display:inline-flex;align-items:center;min-height:var(--size-hit-phone)}
  .vl-row.static,.vl-head{height:auto;min-height:var(--size-row-phone)}
}
@media (pointer:coarse){
  .stat>a,.waiting,.nav-count.waiting{display:inline-flex;align-items:center;min-height:var(--size-hit-phone)}
  .search{min-height:var(--size-hit-phone)}.search input{align-self:stretch}
  .answers input,.setting input,.naming input,.setting .value{min-height:var(--size-hit-phone)}
}

/* Composer and offline marker (D15) */
.composer{display:flex;gap:var(--space-2);align-items:flex-end;padding:var(--space-3) var(--space-4);border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;min-height:var(--size-control);max-height:calc(var(--size-control) * 6);padding:var(--space-2) var(--space-3);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);font:inherit;resize:vertical}
.offline-marker{display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border-radius:var(--radius-sm);background:var(--tone-bg);color:var(--tone-fg);font-size:var(--font-size-sm)}
.offline-marker .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.offline-marker a{margin-left:var(--space-2);color:inherit}
@media (pointer:coarse){.composer textarea{min-height:var(--size-hit-phone)}}
.sub-h{margin:var(--space-3) 0 var(--space-1);font-size:var(--font-size-sm);color:var(--fg-muted);font-weight:var(--font-weight-medium)}
.conversation .pane{display:flex;flex-direction:column}

/* Updating list (fleet-view-urls-and-list-path.md §2): last rows and counts stay, dimmed; a thin bar shows the request. */
.list-progress{height:var(--space-1);background:transparent}
.list-view.pending .list-progress{background:var(--accent)}
.list-view.pending .vl-row,.counters.pending .counter{color:var(--fg-muted)}
.row-check{width:var(--size-icon);height:var(--size-icon);margin:0;accent-color:var(--accent)}
/* Lab matrix (docs/design-system/pages/laboratory.md): a static row per example, one cell per variant holding its
   summary per evaluator and one line per repeat. Rows grow with repeats. */
.vl-row.static.lab-row{height:auto;min-height:var(--size-row);align-items:start;padding-top:var(--space-2);padding-bottom:var(--space-2);white-space:normal}
.lab-cell{display:flex;flex-direction:column;gap:var(--space-1)}
.lab-trial{display:flex;align-items:center;gap:var(--space-2);font-variant-numeric:tabular-nums}
.lab-patch{margin:0;padding:var(--space-2) var(--space-4);font-family:var(--font-mono);font-size:var(--font-size-sm);overflow-x:auto}
/* Conversation detail: the status line overlays the thread top, so it never moves the rows (OR-23) */
.status-line{position:relative;height:0}
.status-line>*{position:absolute;left:0;right:0;top:0;z-index:2}
.composer-bar{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-4);min-height:var(--size-control)}
/* Markdown in replies */
.md>*+*{margin-top:var(--space-2)}
.md .md-h{margin:var(--space-3) 0 0;font-size:var(--font-size-md);font-weight:var(--font-weight-bold)}
.md ul,.md ol{margin:0;padding-left:var(--space-5)}
.md blockquote{margin:0;padding-left:var(--space-3);border-left:2px solid var(--line);color:var(--fg-muted)}
.md hr{border:0;border-top:1px solid var(--line)}
.md a{color:var(--accent)}
.md-table{overflow-x:auto}
.md table{border-collapse:collapse;font-size:var(--font-size-sm)}
.md th,.md td{border:1px solid var(--line);padding:var(--space-1) var(--space-2);text-align:left}
/* A conversation fills the work area; the thread is its one scroller and takes what the header and composer leave (OR-25) */
.detail.conversation{overflow:hidden}
.conversation .pane{flex:1;min-height:0}
.conversation .transcript,.conversation .tr-body{flex:1;min-height:0}
.conversation .tr-body .vl{flex:1;height:auto;min-height:0}
.vl-row.picked{background:var(--hover)}
.vl-row.picked.marked{background:var(--selected)}
/* Artifact view (result viewer body): media in a fixed-ratio frame, text paged by scrolling */
.av{display:flex;flex-direction:column;gap:var(--space-2);min-height:0}
.av-frame{aspect-ratio:4/3;background:var(--surface-sunken);border:1px solid var(--line);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;overflow:hidden}
.av-frame.video{aspect-ratio:16/9}
.av-frame img,.av-frame video{max-width:100%;max-height:100%;object-fit:contain}
.av-frame.page{aspect-ratio:auto;height:var(--size-page-list)}
.av-frame iframe{width:100%;height:100%;border:0;background:var(--surface)}
.av-text{height:var(--size-page-list);overflow:auto;background:var(--surface-sunken);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-3)}
.av-text pre{margin:0;font-family:var(--font-mono);font-size:var(--font-size-sm);white-space:pre-wrap;overflow-wrap:anywhere}

/* Catalogue rows in the control column: two lines, title then ID and secondary facts; no column heads (D19) */
.split-list .vl{flex:1;height:auto}
.split-list .vl-head{display:none}
.split-list .vl-row .tt{flex-wrap:wrap;align-content:center;align-items:center;row-gap:0}
.split-list .vl-row .tt .title{order:-1;flex:0 0 100%}
.split-list .vl-row.static{height:auto;min-height:var(--size-row-2)}
/* Direction B (D19): small labels in mono capitals */
.rail-h,.dsec h3,.totals dt,.sub-h,.seg-label,.group-h,.vl-head{font-family:var(--font-mono);font-size:var(--font-size-xs);text-transform:uppercase;letter-spacing:.06em}
.page-h h1{letter-spacing:-.01em}

/* Direction B details (D19): ticks and hairlines instead of fills and boxes */
.shell-main,.rail,.split-list,.detail,.vl{scrollbar-width:thin}
.vl-row .badge.compact{background:none}
.nav-i.cur{box-shadow:inset 3px 0 var(--accent)}
.detail-title{font-size:var(--font-size-2xl);letter-spacing:-.01em;text-wrap:balance}
.detail-h .mono{font-size:var(--font-size-sm)}
.totals{gap:0;background:none;border:0;border-top:1px solid var(--fg-muted);border-bottom:1px solid var(--line);border-radius:0}
.totals>div{background:none;padding-left:0}
.totals>div+div{border-left:1px solid var(--line);padding-left:var(--space-4)}
.totals dd{font-family:var(--font-mono)}
.decision{border:0;border-left:3px solid var(--attention-fg);border-radius:0 var(--radius-md) var(--radius-md) 0}
.decision.answered{border:0;border-left:3px solid var(--success-fg)}
.tabs{gap:var(--space-4)}
.tabs button{padding:0;border-radius:0;font-weight:var(--font-weight-medium)}
.tabs button[aria-selected=true]{background:none;color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.counter{background:none;border-color:var(--line);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.counter.on{background:var(--tone-bg);border-color:var(--tone-fg);box-shadow:none}
.counter.zero{border-color:var(--line-soft)}
.seg.on,.saved-chip.on{color:var(--accent)}
.search{background:var(--surface)}
.vl-row.grp{background:var(--bg);border-bottom-color:var(--line)}
.work-empty{font-family:var(--font-mono);font-size:var(--font-size-sm)}
.tr-body .vl{background:none}
.th-text.operator{background:var(--surface-sunken);box-shadow:inset 3px 0 var(--accent)}
.outcome{border-left:3px solid var(--line);border-radius:0 var(--radius-md) var(--radius-md) 0}
/* Catalogue rows built by hand (hosts, keys, limits): same two lines; second-line facts may wrap */
.split-list .vl-row.static{padding-top:var(--space-2);padding-bottom:var(--space-2);align-items:start}
.split-list .vl-row .fill-wrap{flex:0 0 100%;flex-wrap:wrap;row-gap:0}
.split-list .vl-row .fill-wrap .legend{flex-basis:100%}
.split-list .vl-row.static .tt{white-space:normal;column-gap:var(--space-3);row-gap:var(--space-1)}

/* Definition editor parts (D20): draft bar, choice, step list, flow strip */
.problem.draft{border-left-color:var(--attention-fg)}
.seg .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.detail-title{display:flex;align-items:center;gap:var(--space-3)}
.diff.block{padding:var(--space-3);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-md);white-space:pre-wrap;overflow-wrap:anywhere}
.steps{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-md)}
.step-item{border-bottom:1px solid var(--line-soft)}
.step-item:last-child{border-bottom:0}
.step{display:grid;grid-template-columns:var(--space-6) var(--size-badge) var(--size-fill) minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:center;width:100%;min-height:var(--size-row-2);padding:var(--space-2) var(--space-3);border:0;background:none;text-align:left;cursor:pointer}
.step:hover{background:var(--hover)}
.step.open{background:var(--selected);box-shadow:inset 3px 0 var(--accent)}
.step .no{font-family:var(--font-mono);font-size:var(--font-size-sm);color:var(--fg-muted)}
.step .lead{display:inline-flex;color:var(--fg-muted)}
.step .nm{font-weight:var(--font-weight-medium)}
.step .ex{min-width:0;color:var(--fg-muted)}
.step .ex b{color:var(--fg);font-weight:var(--font-weight-regular)}
.step .io{grid-column:3/-1;font-family:var(--font-mono);font-size:var(--font-size-sm);color:var(--fg-muted)}
.step .io .w{color:var(--fg)}
.step .svc{display:inline-flex;align-items:center;gap:var(--space-3)}
.step-item.inset,.step-band.inset{box-shadow:inset 3px 0 var(--line)}
.step-band{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);background:var(--bg);border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);font-size:var(--font-size-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted)}
.step-band .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.step-error,.step-edit{padding:var(--space-2) var(--space-4) var(--space-2) calc(var(--space-6) + var(--size-badge) + 3 * var(--space-3))}
.step-error{background:var(--danger-bg);color:var(--danger-fg);font-family:var(--font-mono);font-size:var(--font-size-sm)}
.step-edit{display:flex;flex-direction:column;gap:var(--space-2);padding-top:var(--space-3);padding-bottom:var(--space-4);border-top:1px solid var(--line-soft)}
.flow{display:flex;align-items:center;overflow-x:auto;padding:var(--space-1) 0}
.flow-n{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--size-control);padding:0 var(--space-3);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--bg);font-family:var(--font-mono);font-size:var(--font-size-sm);white-space:nowrap}
.flow-n .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.flow-n .badge{background:none}
.flow-n.cur{border-color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.flow-n.opt{border-style:dashed}
.flow-w{flex:none;width:var(--space-5);height:1px;background:var(--fg-muted)}
.flow-par{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-2) var(--space-3);border-left:1px solid var(--fg-muted);border-right:1px solid var(--fg-muted)}
.flow-loop{display:inline-flex;align-items:center;position:relative;padding:var(--space-6) var(--space-3) var(--space-3);border:1px dashed var(--fg-muted);border-radius:var(--radius-md)}
.flow-cap{position:absolute;top:var(--space-2);left:var(--space-3);display:inline-flex;align-items:center;gap:var(--space-2);font-family:var(--font-mono);font-size:var(--font-size-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted);white-space:nowrap}
.flow-cap .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
/* Layout of the book page only; controls are styled in src/styles.css. */
.page{max-width:1320px;margin:0 auto;padding:var(--space-5)}
.bk-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4);margin-bottom:var(--space-4)}
.bk-head h1{margin:0;font-size:var(--font-size-xl);font-weight:var(--font-weight-bold)}
.bk-head p{margin:0}
.toc{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);margin-bottom:var(--space-6);font-size:var(--font-size-sm)}
.bk{margin-bottom:var(--space-7)}
.bk h2{display:flex;align-items:baseline;gap:var(--space-3);margin:0 0 var(--space-2);font-size:var(--font-size-lg);font-weight:var(--font-weight-bold)}
.bk h2 .spec{font-size:var(--font-size-sm);font-weight:var(--font-weight-regular)}
.bk-note{margin:0 0 var(--space-3);color:var(--fg-muted);max-width:80ch}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
.frame{min-width:0;padding:var(--space-4);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--radius-lg)}
.frame-label{margin-bottom:var(--space-3);font-size:var(--font-size-xs);color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.col>.btn{align-self:flex-start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.badges{display:flex;flex-direction:column;gap:var(--space-2)}
.brow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--size-label),1fr));gap:var(--space-2);margin-bottom:var(--space-4)}
.swatches div{border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
.swatches i{display:block;height:var(--size-control)}
.swatches span{display:block;padding:var(--space-1) var(--space-2);font-family:var(--font-mono);font-size:var(--font-size-xs);color:var(--fg-muted)}
.type-xl{margin:var(--space-1) 0;font-size:var(--font-size-xl);font-weight:var(--font-weight-bold)}
.type-lg{margin:var(--space-1) 0;font-size:var(--font-size-lg);font-weight:var(--font-weight-bold)}
.type-sm{font-size:var(--font-size-sm)}
.nav{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.nav a{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--size-control);padding:0 var(--space-3);border-radius:var(--radius-md);color:var(--fg-muted);text-decoration:none}
.nav a:hover{background:var(--hover)}
.nav a[aria-current=page]{background:var(--selected);color:var(--fg)}
.frame .vl{--list-height:var(--size-list)}
.frame .rv-b .empty{padding:var(--space-4)}
@media (max-width:1000px){.pair,.grid2{grid-template-columns:1fr}}
.rail-demo{display:flex;max-height:var(--size-list);overflow:auto}
