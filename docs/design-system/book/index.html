.page{max-width:1320px;margin:0 auto;padding:var(--space-5)}
.bk-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4);margin-bottom:var(--space-4)}
.bk-head h1{margin:0;font-size:var(--font-size-xl);font-weight:var(--font-weight-bold)}
.bk-head p{margin:0}
.toc{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);margin-bottom:var(--space-6);font-size:var(--font-size-sm)}
.bk{margin-bottom:var(--space-7)}
.bk h2{display:flex;align-items:baseline;gap:var(--space-3);margin:0 0 var(--space-2);font-size:var(--font-size-lg);font-weight:var(--font-weight-bold)}
.bk h2 .spec{font-size:var(--font-size-sm);font-weight:var(--font-weight-regular)}
.bk-note{margin:0 0 var(--space-3);color:var(--fg-muted);max-width:80ch}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
.frame{min-width:0;padding:var(--space-4);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--radius-lg)}
.frame-label{margin-bottom:var(--space-3);font-size:var(--font-size-xs);color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.col>.btn{align-self:flex-start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.badges{display:flex;flex-direction:column;gap:var(--space-2)}
.brow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--size-label),1fr));gap:var(--space-2);margin-bottom:var(--space-4)}
.swatches div{border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
.swatches i{display:block;height:var(--size-control)}
.swatches span{display:block;padding:var(--space-1) var(--space-2);font-family:var(--font-mono);font-size:var(--font-size-xs);color:var(--fg-muted)}
.type-xl{margin:var(--space-1) 0;font-size:var(--font-size-xl);font-weight:var(--font-weight-bold)}
.type-lg{margin:var(--space-1) 0;font-size:var(--font-size-lg);font-weight:var(--font-weight-bold)}
.type-sm{font-size:var(--font-size-sm)}
.nav{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.nav a{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--size-control);padding:0 var(--space-3);border-radius:var(--radius-md);color:var(--fg-muted);text-decoration:none}
.nav a:hover{background:var(--hover)}
.nav a[aria-current=page]{background:var(--selected);color:var(--fg)}
.frame .vl{--list-height:var(--size-list)}
.frame .rv-b .empty{padding:var(--space-4)}
@media (max-width:1000px){.pair,.grid2{grid-template-columns:1fr}}
