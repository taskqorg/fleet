.stale{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--font-size-sm);color:var(--fg-muted)}

@media (max-width:640px){
  .btn,.chip,.saved-chip,.seg,.tabs button{min-height:var(--size-hit-phone)}
  .setting{grid-template-columns:1fr}.setting .help{grid-column:1}
}
@media (pointer:coarse){.btn,.chip button,.tw,.pill{min-height:var(--size-hit-phone);min-width:var(--size-hit-phone)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Tooltip (OR-20): small, contextual, distinct floating surface (OR-16) */
.tooltip{position:fixed;z-index:10;max-width:var(--size-tip);transform:translate(-50%,calc(-100% - var(--space-2)));padding:var(--space-1) var(--space-2);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--float);color:var(--fg);box-shadow:var(--elevation-popover);font-size:var(--font-size-sm);line-height:var(--font-line);pointer-events:none}
.tooltip.below{transform:translate(-50%,var(--space-2))}
.vl-row .id{margin-left:0}
.vl-row .btn.icon-only{border-color:transparent;background:none}.vl-row .btn.icon-only:hover{background:var(--hover)}

/* Split button */
.split{position:relative;display:inline-flex}
.split>.btn:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.split-more{width:var(--size-badge);padding:0;justify-content:center;border-left-width:0;border-top-left-radius:0;border-bottom-left-radius:0}
.split.primary .split-more{border-left:1px solid var(--on-accent)}
.menu{position:absolute;top:calc(100% + var(--space-1));right:0;z-index:5;display:flex;flex-direction:column;min-width:var(--size-label);padding:var(--space-1);background:var(--float);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--elevation-popover)}
.menu button{display:flex;align-items:center;gap:var(--space-2);height:var(--size-control);padding:0 var(--space-3);border:0;border-radius:var(--radius-sm);background:none;text-align:left;cursor:pointer;white-space:nowrap}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}

/* State counters */
.counters{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.counter{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--size-chip);padding:0 var(--space-2);border:1px solid transparent;border-radius:var(--radius-pill);background:var(--tone-bg);color:var(--tone-fg);cursor:pointer;font-size:var(--font-size-sm)}
.counter .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.counter.zero{background:none;color:var(--fg-muted)}
.counter.on{border-color:var(--tone-fg);box-shadow:inset 0 0 0 1px var(--tone-fg)}

/* Group header */
.group-h{display:flex;align-items:center;gap:var(--space-2);width:100%;height:100%;padding:0;border:0;background:none;color:var(--tone-fg);cursor:pointer;font-size:var(--font-size-sm)}
.group-h b{color:var(--fg)}
.group-h .num{margin-left:auto;color:var(--fg-muted)}
.vl-row.grp{grid-template-columns:1fr;background:var(--surface-sunken)}

/* Presets */
.presets{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1)}
.preset{display:inline-flex;align-items:center;border-radius:var(--radius-md)}
.preset button{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--size-chip);padding:0 var(--space-2);border:0;border-radius:var(--radius-md);background:none;color:var(--fg-muted);font-size:var(--font-size-sm);cursor:pointer}
.preset .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.preset .x{width:var(--size-chip);padding:0;justify-content:center}
.preset:hover{background:var(--hover)}
.preset.on{background:var(--selected)}.preset.on button{color:var(--fg)}
.naming{display:inline-flex;gap:var(--space-1)}
.naming input{width:var(--size-input);height:var(--size-chip);padding:0 var(--space-2);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}

/* Navigation rail */
.rail{display:flex;flex-direction:column;gap:var(--space-3);width:var(--size-rail);padding:var(--space-3) var(--space-2);border-right:1px solid var(--line);background:var(--surface)}
.rail-g{list-style:none;margin:0;padding:0}
.rail-g.pinned{padding-bottom:var(--space-3);border-bottom:1px solid var(--line)}
.rail-h{padding:var(--space-1) var(--space-3);font-size:var(--font-size-xs);color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em}
.nav-i{display:flex;align-items:center;border-radius:var(--radius-md)}
.nav-i a{flex:1;display:flex;align-items:center;gap:var(--space-2);min-width:0;height:var(--size-control);padding:0 var(--space-3);color:var(--fg-muted);text-decoration:none}
.nav-i .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i:hover{background:var(--hover)}
.nav-i.cur{background:var(--selected)}.nav-i.cur a{color:var(--fg)}
.nav-count{padding:0 var(--space-2);border-radius:var(--radius-pill);background:var(--tone-bg);color:var(--tone-fg);font-family:var(--font-mono);font-size:var(--font-size-xs)}
.nav-pin{display:inline-flex;align-items:center;justify-content:center;width:var(--size-control);height:var(--size-control);border:0;background:none;color:var(--fg-muted);cursor:pointer;opacity:0}
.nav-pin .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.nav-i:hover .nav-pin,.nav-pin:focus-visible{opacity:1}
.rail-search{flex:none;margin:0 var(--space-1)}
@media (pointer:coarse){.nav-pin{opacity:1}}

/* Stat strip */
.stats{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.stat{display:inline-flex}
.stat>a,.stat{align-items:center;gap:var(--space-2);color:inherit;text-decoration:none}
.stat{padding:var(--space-2) var(--space-3);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
.stat>a{display:inline-flex}
.stat .icon{color:var(--fg-muted)}
.stat.toned .icon,.stat.toned .sv{color:var(--tone-fg)}
.stat .sv{font-size:var(--font-size-lg);font-family:var(--font-mono)}
.stat .of{color:var(--fg-muted);font-size:var(--font-size-sm)}
.stat .sl{color:var(--fg-muted);font-size:var(--font-size-sm)}
.row-link{color:inherit;text-decoration:none}.row-link:hover{text-decoration:underline}
.vl-row.sel{background:var(--selected);box-shadow:inset 3px 0 var(--accent)}
.seg-group{display:inline-flex;gap:var(--space-1)}

/* App shell and page layout (patterns/app-shell.md) */
.shell{display:flex;flex-direction:column;min-height:100%}
.topbar{display:flex;align-items:center;gap:var(--space-4);height:var(--size-topbar);padding:0 var(--space-4);border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-size:var(--font-size-lg)}
.waiting{text-decoration:none;font-size:var(--font-size-sm);padding:var(--space-1) var(--space-3)}
.shell-body{display:flex;flex:1;min-height:0}
.shell-main{flex:1;min-width:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-4)}
.page-h{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)}
.page-h h1{margin:0;font-size:var(--font-size-xl);font-weight:var(--font-weight-bold)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:var(--font-size-md);font-weight:var(--font-weight-bold)}
.panel>.setting{padding-left:var(--space-4);padding-right:var(--space-4)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:var(--space-4);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--space-3)}
.panel>.stack{padding:var(--space-3)}
.kv{list-style:none;margin:0;padding:var(--space-2) var(--space-4)}
.kv li{display:flex;align-items:center;gap:var(--space-3);min-height:var(--size-row)}
.kv .k{min-width:var(--size-clock);font-weight:var(--font-weight-medium)}
.kv .v{font-family:var(--font-mono)}
.split-view{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-4);align-items:start}
.split-view.has-detail{grid-template-columns:minmax(0,1fr) minmax(0,var(--size-detail))}
.split-list{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.detail{display:flex;flex-direction:column;gap:var(--space-3);min-width:0;padding:var(--space-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg)}
.detail-h{display:flex;align-items:center;gap:var(--space-2)}
.detail-title{margin:0;font-size:var(--font-size-lg);font-weight:var(--font-weight-bold)}
.state-line{display:flex;align-items:center;gap:var(--space-3)}
.detail-tabs{border-bottom:1px solid var(--line);padding-bottom:var(--space-1)}
.vl-row.static{position:relative;transform:none;height:var(--size-row);cursor:default}
.list-view .vl{height:var(--list-height,var(--size-list))}
@media (max-width:1100px){.cols,.split-view.has-detail{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .rail{width:auto;padding:var(--space-2) var(--space-1)}
  .rail .nm,.rail .rail-h,.rail-search,.rail .nav-pin{display:none}
  .rail .nav-i a{padding:0 var(--space-2);position:relative}
  .rail .nav-count{position:absolute;top:0;right:0;padding:0 var(--space-1)}
  .shell-main{padding:var(--space-3)}
}
.vl-head .r{text-align:right}

/* Harness marks and counts, stage chip, outcome block, detail sections (D11) */
.harness{display:inline-flex;color:var(--fg-muted)}
.harness-counts{display:inline-flex;gap:var(--space-2);align-items:center}
.hc{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--font-size-sm);color:var(--fg-muted)}
.hc .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.hc .num{color:var(--fg)}
.outcome{display:flex;gap:var(--space-2);align-items:flex-start;padding:var(--space-3);background:var(--surface-sunken);border-radius:var(--radius-md)}
.outcome-b{flex:1;min-width:0}
.outcome p{margin:0 0 var(--space-2)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.outcome-meta{display:flex;flex-wrap:wrap;gap:var(--space-1);align-items:center}
.chip.in{gap:var(--space-1);padding-right:var(--space-2)}
.reqs{list-style:none;margin:var(--space-2) 0;padding:0}
.reqs li{display:flex;gap:var(--space-2);align-items:center;min-height:var(--size-control)}
.dsec{padding:var(--space-2) 0;border-top:1px solid var(--line-soft)}
.dsec h3{margin:0 0 var(--space-1);font-size:var(--font-size-sm);color:var(--fg-muted);font-weight:var(--font-weight-medium)}
.kv-row{display:flex;align-items:center;gap:var(--space-2);min-height:var(--size-row)}
.vl-row .lead{display:flex;align-items:center}
.vl-row .tt{display:flex;align-items:baseline;gap:var(--space-2);min-width:0}
.vl-row .tt .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vl-row .tt .id{margin:0;flex:none}
.vl-row .p0{color:var(--danger-fg);font-family:var(--font-mono);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}
.stack-pad{padding:0 var(--space-4) var(--space-2)}
.counter.sigma .sig{font-weight:var(--font-weight-bold)}
.counter.sigma{margin-right:var(--space-1)}

/* D14 review fixes */
.legend{white-space:normal}
.kv .k{white-space:nowrap}
.chip-age .icon{width:var(--size-icon-sm);height:var(--size-icon-sm);margin-right:var(--space-1);vertical-align:-2px}
.chip-age.alert{display:inline-flex;align-items:center}
.seg-group{align-items:center}.seg-label{font-size:var(--font-size-sm);color:var(--fg-muted);margin-right:var(--space-1)}
.skip{position:absolute;left:var(--space-2);top:-100px;z-index:20;padding:var(--space-2) var(--space-3);background:var(--accent);color:var(--on-accent);border-radius:var(--radius-md)}
.skip:focus{top:var(--space-2)}
.shell-main:focus{outline:none}
.detail:focus{outline:none}
@media (max-width:1100px){.split-view.has-detail>.detail{order:-1}}
@media (max-width:760px){.rail .nav-count{top:calc(-1 * var(--space-1));right:calc(-1 * var(--space-1))}}
/* M2: 44 px targets on touch for row pins, row links, nav links (owner exception) */
@media (pointer:coarse){
  .vl-row .btn.icon-only,.nav-i a,.nav-pin,.counter,.seg,.preset button,.saved-chip,.tabs button,.menu button{min-height:var(--size-hit-phone);min-width:var(--size-hit-phone)}
  .row-link{display:inline-flex;align-items:center;min-height:var(--size-hit-phone)}
  .vl-row.static,.vl-head{height:auto;min-height:var(--size-row-phone)}
}
@media (pointer:coarse){
  .stat>a,.waiting,.nav-count.waiting{display:inline-flex;align-items:center;min-height:var(--size-hit-phone)}
  .search{min-height:var(--size-hit-phone)}.search input{align-self:stretch}
  .answers input,.setting input,.naming input,.setting .value{min-height:var(--size-hit-phone)}
}

/* Composer and offline marker (D15) */
.composer{display:flex;gap:var(--space-2);align-items:flex-end;padding:var(--space-3) var(--space-4);border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;min-height:var(--size-control);max-height:calc(var(--size-control) * 6);padding:var(--space-2) var(--space-3);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);font:inherit;resize:vertical}
.offline-marker{display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border-radius:var(--radius-sm);background:var(--tone-bg);color:var(--tone-fg);font-size:var(--font-size-sm)}
.offline-marker .icon{width:var(--size-icon-sm);height:var(--size-icon-sm)}
.offline-marker a{margin-left:var(--space-2);color:inherit}
@media (pointer:coarse){.composer textarea{min-height:var(--size-hit-phone)}}
.sub-h{margin:var(--space-3) 0 var(--space-1);font-size:var(--font-size-sm);color:var(--fg-muted);font-weight:var(--font-weight-medium)}
.conversation .pane{display:flex;flex-direction:column}

/* Updating list (fleet-view-urls-and-list-path.md §2): last rows and counts stay, dimmed; a thin bar shows the request. */
.list-progress{height:var(--space-1);background:transparent}
.list-view.pending .list-progress{background:var(--accent)}
.list-view.pending .vl-row,.counters.pending .counter{color:var(--fg-muted)}
.row-check{width:var(--size-icon);height:var(--size-icon);margin:0;accent-color:var(--accent)}
/* Lab matrix (docs/design-system/pages/laboratory.md): a static row per example, one cell per variant holding its
   summary per evaluator and one line per repeat. Rows grow with repeats. */
.vl-row.static.lab-row{height:auto;min-height:var(--size-row);align-items:start;padding-top:var(--space-2);padding-bottom:var(--space-2);white-space:normal}
.lab-cell{display:flex;flex-direction:column;gap:var(--space-1)}
.lab-trial{display:flex;align-items:center;gap:var(--space-2);font-variant-numeric:tabular-nums}
.lab-patch{margin:0;padding:var(--space-2) var(--space-4);font-family:var(--font-mono);font-size:var(--font-size-sm);overflow-x:auto}
/* Conversation detail: the status line overlays the thread top, so it never moves the rows (OR-23) */
.status-line{position:relative;height:0}
.status-line>*{position:absolute;left:0;right:0;top:0;z-index:2}
.composer-bar{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-4);min-height:var(--size-control)}
