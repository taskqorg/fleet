<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet · Character workflow</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--background,#fafafa);color:var(--foreground,#202124);font:16px/1.5 var(--font-sans,system-ui)}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border,#ccc);border-radius:6px;padding:7px 12px;background:var(--card,#fff);color:var(--card-foreground,#202124)}button:hover{background:var(--accent,#e9eef8);color:var(--accent-foreground,#172b4d)}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--ring,#527bdd);outline-offset:2px}button[aria-current="page"],.primary{background:var(--primary,#234eb5);color:var(--primary-foreground,#fff)}button:disabled{opacity:.55;cursor:default}header{padding:16px 20px;border-bottom:1px solid var(--border,#ddd)}header strong{font-size:21px}.muted,small{color:var(--muted-foreground,#60656d)}small{display:block}.shell{max-width:1100px;margin:auto}nav{display:flex;gap:6px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--border,#ddd)}main{padding:20px}h1{font-size:24px;margin:4px 0 8px}h2{font-size:18px;margin:0 0 10px}p{margin:8px 0 14px}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}.panel{padding:16px;border:1px solid var(--border,#ddd);border-radius:8px;background:var(--card,#fff);color:var(--card-foreground,#202124);margin-bottom:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border,#ddd)}.row:last-child{border:0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.badge{display:inline-block;background:var(--muted,#eee);color:var(--foreground,#202124);padding:2px 8px;border-radius:4px;font-size:14px}.viewer{height:210px;display:flex;align-items:center;justify-content:center;background:var(--muted,#eee);border-radius:6px;margin:10px 0}.viewer svg{height:190px;width:190px}.notice{border-left:3px solid var(--chart-1,#4169c1);padding:6px 12px;margin:12px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border,#ddd);vertical-align:top}textarea{width:100%;min-height:80px;padding:10px;background:var(--background,#fff);color:var(--foreground,#222);border:1px solid var(--border,#bbb);border-radius:6px}.crumb{font-size:14px;color:var(--muted-foreground,#60656d)}footer{padding:12px 20px;border-top:1px solid var(--border,#ddd)}@media(max-width:650px){.grid{grid-template-columns:1fr}main,header,nav{padding:12px}th,td{padding:8px 4px}h1{font-size:22px}.row{flex-wrap:wrap}}
</style><div class="shell"><header><strong>Fleet / csgo</strong><small>Interactive storyboard · Synthetic scenario · No external actions</small></header><nav aria-label="Workflow" id="nav"></nav><main id="main"></main><footer><span id="feedback" role="status" aria-live="polite">Explore the workflow. Changes stay in this demonstration.</span> <button onclick="reset()">Reset demo</button></footer></div>
<script>
const names=['Session','Task','Result','Execution','Experiment','Apply'];let state={page:0,created:false,trial:false,applied:false,recommended:false,note:''};
const btn=(label,page)=>`<button onclick="go(${page})">${label}</button>`;
const figure=(good=false)=>`<div class="viewer"><svg viewBox="0 0 190 200" role="img" aria-label="Schematic character silhouette, not an actual project model"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="95" cy="27" r="17"/><path d="M77 47L62 92L69 130L65 185L85 185L95 135L105 185L125 185L121 130L128 92L113 47Z"/><path d="M77 47L48 61L28 112L40 120L68 78M113 47L142 61L162 112L150 120L122 78M95 45V135M65 93H125M69 130H121"/></g><circle cx="32" cy="117" r="15" fill="none" stroke="${good?'#22734e':'#b85121'}" stroke-width="3"/><text x="4" y="158" fill="currentColor" font-size="12">${good?'Candidate B':'Candidate A'}</text></svg></div><small>Schematic only. Model, animation and hitbox viewers are not implemented.</small>`;
function go(n){state.page=n;render()}
function say(s){document.getElementById('feedback').textContent=s}
function reset(){state={page:0,created:false,trial:false,applied:false,recommended:false,note:''};render();say('Demo reset.')}
function create(){state.created=true;go(1);say('Demo task created from the conversation.')}
function trial(){state.trial=true;render();say('Simulated comparison available. No pipeline was launched.')}
function apply(){state.applied=true;render();say('Demo rework queued. Product publication has not occurred.')}
function recommend(){state.recommended=true;render();say('Demo project recommendation updated independently of rework.')}
function save(){state.note=document.getElementById('note').value;say('Comment attached to Candidate A in this demo.')}
function render(){document.getElementById('nav').innerHTML=names.map((x,i)=>`<button ${state.page===i?'aria-current="page"':''} onclick="go(${i})">${i+1}. ${x}</button>`).join('');let html='';
if(state.page===0)html=`<div class="crumb">Operator / Session · Character design</div><h1>Make a playable character from these references</h1><div class="grid"><section class="panel"><h2>Conversation</h2><p><strong>You</strong><br>Use the selected turnaround. Keep the silhouette and outfit; the character must work with our existing game animations.</p><p><strong>PM agent</strong><br>I can use the csgo character method. I will attach the turnaround and project requirements, then return the model and game checks.</p><p>The model will need visual review before project acceptance.</p><button class="primary" onclick="create()">Create demo task</button></section><section class="panel"><h2>Assignment preview</h2><div class="row">Project <strong>csgo</strong></div><div class="row">Input <strong>Selected turnaround</strong></div><div class="row">Method <strong>csgo / Playable character</strong></div><div class="row">Result <strong>Game package + checks</strong></div><p class="muted">Technical requirements come from project files; the operator does not fill a skeleton checklist.</p></section></div>`;
if(state.page===1)html=`<div class="crumb">Operator / Tasks / Character task</div><h1>Create a playable character</h1><span class="badge">${state.applied?'In progress · Rework queued':'Waiting · Visual review'}</span><div class="notice">${state.applied?'Candidate B selected. Adaptation and affected game checks must run before acceptance.':'Candidate A is available. Hand shape degraded after optimization; review the result.'}</div><div class="grid"><section class="panel"><h2>Work</h2><div class="row">Create source model <span>Done</span></div><div class="row">Optimize geometry ${btn('Inspect step',3)}</div><div class="row">Adapt to game skeleton <span>${state.applied?'Queued':'Needs rework'}</span></div><div class="row">Game verification <span>Pending</span></div><div class="row">Publication <span>Not started</span></div></section><section class="panel"><h2>Result and context</h2><p>Candidate A · Optimized mesh<br>Source: generated model + selected turnaround<br>Requirements: csgo character specification</p>${btn('Open Candidate A',2)}<p class="muted">An available model is not an accepted game character.</p></section></div>`;
if(state.page===2)html=`<div class="crumb">Operator / Character task / Candidate A</div><h1>Inspect the result</h1><div class="grid"><section class="panel"><h2>Candidate A · Optimized mesh</h2>${figure()}<div class="actions">${btn('Open producing step',3)}${btn('Back to task',1)}</div></section><section class="panel"><h2>Review</h2><div class="row">Geometry budget <span>Pass · Demo</span></div><div class="row">Hand shape <span>Needs rework</span></div><div class="row">Animated deformation <span>Not checked</span></div><div class="row">In-game fit <span>Not checked</span></div><label for="note">Comment on this result</label><textarea id="note" placeholder="The outfit is good; restore the hand shape."></textarea><button onclick="save()">Save demo comment</button><p class="muted">Comments stay attached to this result across both roles.</p></section></div>`;
if(state.page===3)html=`<div class="crumb">Architect / Character task / Optimize geometry</div><h1>Find the cause in the actual step</h1><div class="grid"><section class="panel"><h2>Execution</h2><div class="row">Input <strong>Original generated mesh</strong></div><div class="row">Output ${btn('Candidate A',2)}</div><div class="row">Method <strong>Shared / Geometry reduction</strong></div><div class="row">Settings <strong>Uniform reduction</strong></div><div class="row">Environment <strong>Blender worker · Demo</strong></div><div class="row">Time / cost <strong>Not measured</strong></div></section><section class="panel"><h2>Investigate</h2><p>The output meets the geometry budget, but hand detail was lost. Compare a method that protects hands using this same source mesh.</p><p>Keep the generation result. Repeat optimization and then check affected deformation.</p><button class="primary" onclick="go(4)">Open experiment from this step</button><div class="actions">${btn('Return to task',1)}</div></section></div>`;
if(state.page===4)html=`<div class="crumb">Architect / Laboratory / Hand preservation</div><h1>Compare methods on the same input</h1><p>Source: Character task → Optimize geometry → Original generated mesh.</p><section class="panel"><table><thead><tr><th>Variant</th><th>Change</th><th>Review</th></tr></thead><tbody><tr><td>A · Existing</td><td>Uniform reduction</td><td>Hand shape degraded</td></tr><tr><td>B · Trial</td><td>Protect hand regions</td><td>${state.trial?'Better shape · Deformation still unverified':'Not run'}</td></tr></tbody></table><p>Comparison: visual shape, geometry budget, deformation, time and cost. Unmeasured criteria remain unknown.</p><button class="primary" onclick="trial()">${state.trial?'Repeat demo trial':'Simulate trial'}</button>${state.trial?`<div class="notice">Demo outcome: B retains more hand detail. This does not establish game readiness.</div><div class="actions">${btn('Review application choices',5)}</div>`:''}</section>`;
if(state.page===5)html=`<div class="crumb">Architect / Laboratory / Apply improvement</div><h1>Two independent choices</h1>${!state.trial?'<p>Run the demonstration trial to enable these choices.</p>':''}<div class="grid"><section class="panel"><h2>Existing character</h2><p>Use Candidate B in the original task. Repeat skeleton adaptation and affected game checks. Keep Candidate A in history.</p><button class="primary" ${!state.trial||state.applied?'disabled':''} onclick="apply()">${state.applied?'Demo rework queued':'Apply to demo task'}</button><p class="muted">Publication follows project requirements. No automatic acceptance.</p>${btn('Open original task',1)}</section><section class="panel"><h2>Future characters</h2><p>Recommend the hand-preserving method for csgo character optimization. Other projects keep their recommendations.</p><button ${!state.trial||state.recommended?'disabled':''} onclick="recommend()">${state.recommended?'Recommended in demo':'Recommend for csgo'}</button><p class="muted">This affects future method selection. It does not replace existing character results.</p></section></div>`;
document.getElementById('main').innerHTML=html;if(state.page===2)document.getElementById('note').value=state.note;
}render();
</script></html>
