# Drop-in for the PDS18 executor (user fleet-agent): its releases are root-owned under /opt/fleet-agent/releases, so
# fleet-agent cannot replace its own executor (docs/designs/fleet-self-update.md §3.1). Install as
# /home/fleet-agent/.config/systemd/user/fleet-executor.service.d/pds18.conf next to deploy/hosts/linux/fleet-executor.service.
[Service]
ExecStart=
ExecStart=/opt/fleet-agent/releases/current/fleet-executor
