# systemd drop-in: /etc/systemd/system/user-1005.slice.d/fleet-memory.conf (owner decision 2026-11-26).
# The fleet user's services (coordinator, gateway, access guard, ClickHouse, Garage; about 1.5 GB on 2026-11-26) are
# spared by reclaim up to this much while other cgroups have reclaimable memory. Best effort, not a cap.
[Slice]
MemoryLow=2G
