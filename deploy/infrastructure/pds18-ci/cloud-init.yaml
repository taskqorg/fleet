#cloud-config
# Provisioning substitutes only the dedicated guest-management public key.
users:
  - name: ci
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - GUEST_MANAGEMENT_PUBLIC_KEY
ssh_pwauth: false
disable_root: true
package_update: true
package_upgrade: true
packages:
  - build-essential
  - ca-certificates
  - curl
  - docker.io
  - dnsutils
  - gh
  - git
  - jq
  - libicu74
  - postgresql
  - python3
  - unzip
  - zstd
write_files:
  # The runner service is no login session: with logind's default RemoveIPC=yes, the ci user's shared memory (a release
  # job's PostgreSQL) is deleted when its last SSH session ends. logind reads this at start, hence the restart below.
  - path: /etc/systemd/logind.conf.d/50-fleet-keep-ipc.conf
    content: |
      [Login]
      RemoveIPC=no
runcmd:
  - [systemctl, enable, --now, docker]
  - [usermod, -aG, docker, ci]
  - [systemctl, restart, systemd-logind]
