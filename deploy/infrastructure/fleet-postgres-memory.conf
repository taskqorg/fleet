# PostgreSQL memory for Fleet on PDS18: /etc/postgresql/18/main/conf.d/10-fleet-memory.conf (owner decision 2026-11-26).
# The database is 3.3 GB; the default 128 MB left every read of the hot tables (execution, event, change, ~2.9 GB) to
# the page cache, which the host's memory pressure evicted (swap si/so up to 78/132 MB/s on 2026-11-26).
# shared_buffers needs a PostgreSQL restart.
shared_buffers = 3GB
effective_cache_size = 12GB
