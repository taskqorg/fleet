# systemd drop-in: /etc/systemd/system/postgresql@18-main.service.d/fleet-memory.conf (owner decision 2026-11-26).
# Reclaim spares PostgreSQL up to this much while other cgroups have reclaimable memory: shared_buffers (3 GB,
# fleet-postgres-memory.conf) plus its backends. Best effort, not a reservation and not a cap.
[Service]
MemoryLow=4G
